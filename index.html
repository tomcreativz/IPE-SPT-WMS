const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = n => new Intl.NumberFormat('id-ID').format(n || 0);
const fmtRp = n => 'Rp ' + fmtN(Math.round(n || 0));
const fmtD = iso => { if (!iso) return ''; const [y, m, d] = iso.slice(0, 10).split('-'); return `${d}/${m}/${y}`; };
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const byText = (a, b) => String(a || '').localeCompare(String(b || ''), 'id');
function toast(msg, type) {
  const w = $('#toast'), d = document.createElement('div');
  d.textContent = msg; if (type === 'err') d.className = 'err'; w.appendChild(d);
  setTimeout(() => d.remove(), type === 'err' ? 6000 : 2800);

/* ============ state ============ */

function parseCSV(text) {

  const lines0 = text.split(/\r?\n/);
  if (/^sep=/i.test(lines0[0])) lines0.shift();
  text = lines0.join('\n');
  const first = text.split('\n')[0] || '';
  const delim = [';', '\t', ','].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}

function monthStats(ym) {
  const R = computeSOH(ym), start = ym + '-01', end = ym + '-31';
  let awal = 0, inn = 0, out = 0, akhir = 0; const neg = [];
  for (const [pid, r] of R) { const o = SOH_OUT.reduce((s, x) => s + r[x[0]], 0) + r.other, a = r.awal + r.in - o; awal += r.awal; inn += r.in; out += o; akhir += a; if (a < 0) neg.push({ p: partMap.get(pid), a }); }
  let txIn = 0, txOut = 0, orphan = 0;
  for (const m of S.movements) { const d = m.date || ''; if (d < start || d > end) continue; if (!partMap.has(m.partId)) orphan++; if (m.dir === 'in') { if (!isOpening(m)) txIn += m.qty; } else txOut += m.qty; }
  return { awal, inn, out, akhir, neg, txIn, txOut, orphan, okIn: Math.abs(txIn - inn) < 1e-9, okOut: Math.abs(txOut - out) < 1e-9 };
}

/* ============ SOH BULANAN ============ */
const SOH_OUT = [['sold', 'SOLD CUSTOMER', 'Sold Customer'], ['bjm', 'IPE BJM', 'IPE BJM'], ['smd', 'IPE SMD', 'IPE SMD'], ['bpp', 'IPE BPP', 'IPE BPP'], ['ptk', 'IPE PTK', 'IPE PTK'], ['sby', 'IPE SBY', 'IPE SBY'], ['jkt', 'IPE JKT', 'IPE JKT'], ['pky', 'IPE PKY', 'IPE PKY'], ['wh', 'WH03 SERVICE', 'WH03 Service'], ['bund', 'BUNDLING', 'Bundling'], ['dmg', 'PART DAMAGE', 'Part Damage']];
function computeSOH(ym) {
  const start = ym + '-01', end = ym + '-31'; const R = new Map();
  const get = id => { let r = R.get(id); if (!r) { r = { awal: 0, in: 0, other: 0 }; SOH_OUT.forEach(o => r[o[0]] = 0); R.set(id, r); } return r; };
  const byKind = new Map(SOH_OUT.map(o => [o[1], o[0]]));
  for (const m of S.movements) {
    if (!partMap.has(m.partId)) continue; const d = m.date || ''; if (d > end) continue;
    const r = get(m.partId);
    if (d < start) { r.awal += m.dir === 'in' ? m.qty : -m.qty; continue; }
    if (m.dir === 'in') { if (isOpening(m)) r.awal += m.qty; else r.in += m.qty; }
    else { const k = byKind.get(m.kind); if (k) r[k] += m.qty; else r.other += m.qty; }
  }
  return R;
}

}

    },
    act(a) {
      if (a === 'prev') { page = Math.max(0, page - 1); this.fill(); } if (a === 'next') { page++; this.fill(); }
      if (a === 'mkso') pickSOMovement(rows.filter(r => r.sug > 0));
      if (a === 'csv') { const yr = +st.ym.slice(0, 4); exportCSV('laporan-reorder-' + st.ym, [['PART NUMBER', 'DESCRIPTION', 'MODEL', 'SOH', 'STOK FREE', 'PRICE', ...BULAN.map(b => b + ' ' + yr), 'SUM/6 MONTH', 'AVRG 6M', 'MIN', 'MAX', 'MOVEMENT', 'INCOMING', 'TOTAL AVAILABLE', 'RE-ORDER SUGGESTION', 'SHIP', 'SS', 'FREQ', 'BULAN BERTAHAN', 'STATUS URGENSI'],
        ...rows.map(r => [r.p.partNo, r.p.name, r.p.model, r.soh, r.free, r.p.price, ...yearVals(r.p.id, yr), r.T, r.avg, r.min, r.max, r.mv, r.inc, r.avail, r.sug, r.p.ship ?? 1, r.p.ss ?? 1, r.p.freq ?? 1, r.lasts ?? '∞', r.urg])]); }
    },
    fill() {
      const A = analyze(st.ym), q = st.q.toLowerCase(), yr = +st.ym.slice(0, 4);
      rows = [...A.values()].filter(r => (!st.active || r.mv || r.T > 0 || r.soh > 0 || r.inc > 0) && (!st.mv || r.mv === st.mv) && (!st.urg || r.urg === st.urg) && (!q || [r.p.partNo, r.p.name, r.p.model].join(' ').toLowerCase().includes(q))).sort((a, b) => byText(a.p.partNo, b.p.partNo));
      const pages = Math.max(1, Math.ceil(rows.length / PS)); if (page >= pages) page = pages - 1; const sl = rows.slice(page * PS, page * PS + PS);
      $('#tbl').innerHTML = rows.length ? `<table><thead><tr><th>Part number</th><th>Description</th><th>Model</th><th class="n">SOH</th><th class="n">Free</th><th class="n">Price</th>${BULAN.map(b => `<th class="n">${b}</th>`).join('')}<th class="n">Σ 6 bln</th><th class="n">Avg</th><th class="n">Min</th><th class="n">Max</th><th>Movement</th><th class="n">Incoming</th><th class="n">Avail</th><th class="n">Saran order</th><th class="n">Bln bertahan</th><th>Status urgensi</th></tr></thead><tbody>${sl.map(r => `<tr><td class="mono"><b>${esc(r.p.partNo)}</b></td><td>${esc(r.p.name)}</td><td>${esc(r.p.model || '')}</td><td class="n">${fmtN(r.soh)}</td><td class="n ${r.free < 0 ? 'out' : ''}">${fmtN(r.free)}</td><td class="n">${fmtN(r.p.price)}</td>${yearVals(r.p.id, yr).map(v => `<td class="n">${v ? fmtN(v) : ''}</td>`).join('')}<td class="n"><b>${fmtN(r.T)}</b></td><td class="n">${fmtN(r.avg)}</td><td class="n">${fmtN(r.min)}</td><td class="n">${fmtN(r.max)}</td><td>${r.mv ? `<span class="chip ${mvChip(r.mv)}">${r.mv}</span>` : ''}</td><td class="n">${r.inc ? fmtN(r.inc) : ''}</td><td class="n">${fmtN(r.avail)}</td><td class="n"><b>${r.sug ? fmtN(r.sug) : ''}</b></td><td class="n">${r.lasts == null ? '∞' : r.lasts}</td><td><span class="chip ${urgChip(r.urg)}">${r.urg}</span></td></tr>`).join('')}</tbody></table>` : empty(S.parts.length ? 'Tidak ada part yang cocok.' : (loaded.parts ? 'Belum ada spare part.' : 'Memuat…'));
      $('#pg').innerHTML = rows.length > PS ? `<button class="btn sm" data-act="prev" ${page === 0 ? 'disabled' : ''}>‹ Sebelumnya</button><span class="mut">Halaman ${page + 1} / ${pages} · ${fmtN(rows.length)} part</span><button class="btn sm" data-act="next" ${page >= pages - 1 ? 'disabled' : ''}>Berikutnya ›</button>` : `<span class="mut">${fmtN(rows.length)} part</span>`;
    }
  };
}
function yearVals(pid, yr) { const mm = dm.get(pid) || new Map(); return BULAN.map((_, i) => mm.get(`${yr}-${String(i + 1).padStart(2, '0')}`) || 0); }

/* ============ CEK STOK ============ */
function viewCek() {
  let out = [];
  return {
    shell: `<p class="mut" style="margin-top:0">Tempel daftar part dan qty yang diminta (satu baris satu part, pisahkan dengan spasi, tab, atau titik koma). Contoh: <span class="mono">320/A7170 6</span>. Dari Excel, salin dua kolom lalu tempel di sini.</p>
    <div class="card" style="margin-bottom:14px"><textarea id="paste" rows="6" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px" placeholder="320/A7170&#9;6&#10;336/E9730&#9;2">${esc(F.cek.text)}</textarea>
    <div class="bar" style="margin:10px 0 0"><button class="btn primary" data-act="run">Cek stok</button><button class="btn" data-act="clear">Bersihkan</button><span class="grow"></span><button class="btn" data-act="csv">Export CSV</button></div></div><div class="tw"><div id="tbl"></div></div>`,
    input(e) { if (e.target.id === 'paste') F.cek.text = e.target.value; },
    act(a) {
      if (a === 'clear') { F.cek.text = ''; $('#paste').value = ''; out = []; this.fill(); }
      if (a === 'run') { F.cek.text = $('#paste').value; this.fill(); }
      if (a === 'csv') exportCSV('cek-stok', [['PART NUMBER', 'DETAIL', 'REQ QTY', 'BIN LOC', 'STOK', 'STOK FREE', 'STOCK MIN', 'MOVEMENT', 'KETERANGAN'], ...out.map(r => [r.raw, r.p?.name || '', r.req, r.p?.location || '', r.p ? r.soh : '', r.p ? r.free : '', r.min ?? '', r.mv || '', r.ket])]);
    },
    fill() {
      const A = analysisNow(); out = [];
      for (const line of F.cek.text.split(/\r?\n/)) {
        const t = line.trim(); if (!t) continue;
        const mt = t.match(/^(.*?)[\s\t;]+(\d+(?:[.,]\d+)?)$/); const raw = (mt ? mt[1] : t).trim(), req = mt ? parseFloat(mt[2].replace(',', '.')) : 1;
        const p = partFromText(raw); const a = p && A.get(p.id);
        if (!p) { out.push({ raw, req, ket: 'TIDAK DITEMUKAN' }); continue; }
        out.push({ raw, p, req, soh: a.soh, free: a.free, min: a.min, mv: a.mv, ket: a.free >= req ? 'BISA' : (a.soh >= req ? 'TIDAK (stok tersisa untuk PO lain)' : 'TIDAK') });
      }
      $('#tbl').innerHTML = out.length ? `<table><thead><tr><th>Part number</th><th>Detail</th><th class="n">Req qty</th><th>Bin</th><th class="n">Stok</th><th class="n">Stok free</th><th class="n">Stock min</th><th>Movement</th><th>Keterangan</th></tr></thead><tbody>${out.map(r => `<tr><td class="mono"><b>${esc(r.p?.partNo || r.raw)}</b></td><td>${esc(r.p?.name || '')}</td><td class="n">${fmtN(r.req)}</td><td>${esc(r.p?.location || '')}</td><td class="n">${r.p ? fmtN(r.soh) : ''}</td><td class="n ${r.p && r.free < 0 ? 'out' : ''}">${r.p ? fmtN(r.free) : ''}</td><td class="n">${r.p ? fmtN(r.min) : ''}</td><td>${r.mv ? `<span class="chip ${mvChip(r.mv)}">${r.mv}</span>` : ''}</td><td><span class="chip ${r.ket === 'BISA' ? 'ok' : r.ket.startsWith('TIDAK (') ? 'warn' : 'bad'}">${esc(r.ket)}</span></td></tr>`).join('')}</tbody></table>` : empty('Belum ada yang dicek.');
    }
  };
}

/* ============ pengguna ============ */
const ROLES = [['staff', 'Staf Gudang (akses penuh)'], ['admin', 'Admin (buat PO & cek stok)'], ['pssr', 'PSSR (customer, PO, cek stok, lihat transaksi)'], ['manager', 'Branch Manager (lihat seluruh operasional)'], ['viewer', 'Viewer (lihat saja)'], ['pending', 'Menunggu persetujuan']];

  if (error) { console.error(error); return; }
  PROFILES = data || [];
  for (const p of PROFILES) names[p.id] = p.full_name || p.email || '';

function viewUsers() {
  return {
    shell: `<div class="banner info">Akun baru dibuat di dashboard Supabase (Authentication → Users → Add user). Setelah akun itu pertama kali masuk, atur perannya di sini. Peran: <b>Staf Gudang</b> (akses penuh: input barang masuk/keluar, kelola data, hapus, atur pengguna), <b>Admin</b> (hanya membuat PO dan mengecek stok), <b>PSSR</b> (ubah Database Customer, buat PO, cek stok, lihat Transaksi Part In-Out), <b>Branch Manager</b> (lihat seluruh operasional, tanpa mengubah), <b>Viewer</b> (hanya lihat).</div><div class="tw"><div id="tbl"></div></div>`,

    }
  };
}

/* ============ boot / supabase ============ */
function upsertLocal(k, r) {
  const o = { id: r.id, ...(r.data || {}) }; const i = S[k].findIndex(x => x.id === r.id);
  if (i >= 0) S[k][i] = o; else S[k].push(o);
}
const TBL = k => (k === 'sorders' ? 'stockorders' : k);
function makeDb() {
  const chk = (error, rows, what) => { if (error) throw error; if (rows && !rows.length) throw new Error('Tidak punya izin untuk ' + what); };
  return {
    collection: k => ({
      async add(data) { const { data: r, error } = await sb.from(TBL(k)).insert({ data }).select('id,data').single(); if (error) throw error; upsertLocal(k, r); schedule(); return { id: r.id }; },
      async addMany(list) {
        const out = [];
        for (let i = 0; i < list.length; i += 500) {
          const { data: rs, error } = await sb.from(TBL(k)).insert(list.slice(i, i + 500).map(data => ({ data }))).select('id,data'); if (error) throw error;
          rs.forEach(r => upsertLocal(k, r)); out.push(...rs);
        }
        schedule(); return out;
      }
    }),
    doc: path => {
      const [k, id] = path.split('/');
      return {
        async update(patch) {
          const cur = S[k].find(x => x.id === id) || {}; const { id: _i, ...rest } = cur; const nd = { ...rest, ...patch };
          const { data, error } = await sb.from(TBL(k)).update({ data: nd, updated_at: nowISO() }).eq('id', id).select('id'); chk(error, data, 'mengubah data');
          upsertLocal(k, { id, data: nd }); schedule();
        },
        async delete() {
          const { data, error } = await sb.from(TBL(k)).delete().eq('id', id).select('id'); chk(error, data, 'menghapus data');
          S[k] = S[k].filter(x => x.id !== id); schedule();
        }
      };
    }
  };
}
async function fetchAll(k) {
  const out = []; const step = 1000;
  for (let from = 0; ; from += step) {
    const { data, error } = await sb.from(TBL(k)).select('id,data').order('created_at', { ascending: true }).order('id').range(from, from + step - 1);
    if (error) throw error; out.push(...data); if (data.length < step) break;
  }
  return out;
}
const MAIL_DOMAIN = () => ((window.WMS_CONFIG && window.WMS_CONFIG.EMAIL_DOMAIN) || 'gmail.com').replace(/^@/, '');
const toEmail = u => { const t = String(u || '').trim().toLowerCase().replace(/\s+/g, ''); return t.includes('@') ? t : t + '@' + MAIL_DOMAIN(); };
const lastUser = () => { try { return localStorage.getItem('wms-user') || ''; } catch (e) { return ''; } };
function showLogin(msg) {
  const L = $('#login'); L.hidden = false;
  L.innerHTML = `<form class="box" id="lf"><h2>WMS Gudang Spare Part</h2><p>PT Indonesia Prima Equipment · Cabang Sampit</p>
    ${fld('Nama pengguna', 'email', { type: 'text', val: lastUser(), ph: 'mis. bustomiyazid101', attrs: 'required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"' })}${fld('Password', 'password', { type: 'password', attrs: 'required autocomplete="current-password"' })}
    <div class="err" id="lerr">${esc(msg || '')}</div><button class="btn primary" type="submit">Masuk</button></form>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault(); const v = Object.fromEntries(new FormData(e.target)); const btn = $('button', e.target); btn.disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: toEmail(v.email), password: v.password });
    try { if (!error) localStorage.setItem('wms-user', v.email.trim()); } catch (e2) { }
    if (error) {
      const m = String(error.message || '');
      let t = 'Gagal masuk: ' + m;
      if (/invalid login credentials/i.test(m)) t = 'Nama pengguna atau password salah (atau akun belum dibuat di Supabase).';
      else if (/not confirmed/i.test(m)) t = 'Email belum dikonfirmasi. Di Supabase: Authentication > Users, buka akun ini lalu konfirmasi, atau buat ulang dengan "Auto Confirm User" dicentang.';
      else if (/api key|apikey|jwt/i.test(m)) t = 'Kunci API di config.js salah. Pakai anon/publishable key dari Project Settings > API.';
      else if (/failed to fetch|network|load failed/i.test(m)) t = 'Tidak bisa menghubungi Supabase. Periksa SUPABASE_URL di config.js dan koneksi internet.';
      $('#lerr').textContent = t; btn.disabled = false; return;
    }
    L.hidden = true; start(data.session);
  };
}
function showPending(email) {
  const L = $('#login'); L.hidden = false;
  L.innerHTML = `<div class="box"><h2>Menunggu persetujuan</h2><p>Akun <b>${esc(email)}</b> sudah terdaftar tetapi belum diberi peran. Minta admin gudang mengatur peran Anda, lalu muat ulang halaman ini.</p><button class="btn" id="lo">Keluar</button></div>`;
  $('#lo').onclick = async () => { await sb.auth.signOut(); location.reload(); };
}
let raf = 0;
function schedule() { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; reindex(); refresh(); }); }
async function start(session) {
  uid = session.user.id; myEmail = session.user.email;
  const { data: prof, error } = await sb.from('profiles').select('role,full_name').eq('id', uid).maybeSingle();
  if (error) { console.error(error); }
  myRole = prof ? prof.role : 'pending';
  if (!['admin', 'staff', 'viewer', 'pssr', 'manager'].includes(myRole)) return showPending(myEmail);
  isFull = myRole === 'staff'; canWrite = isFull; canPO = isFull || myRole === 'admin' || myRole === 'pssr'; canCust = isFull || myRole === 'pssr';
  $('#role').textContent = { staff: 'Staf gudang', admin: 'Admin (PO & cek stok)', pssr: 'PSSR', manager: 'Branch Manager (lihat saja)', viewer: 'Hanya lihat' }[myRole];
  $('#who').textContent = myEmail; const lo = $('#logout'); lo.hidden = false;
  lo.onclick = async () => { await sb.auth.signOut(); location.reload(); };
  db = makeDb(); buildNav(); initSidebar();
  await loadProfiles();
  const t = setTimeout(() => { loadFailed = true; refresh(); }, 10000);
  try {
    await Promise.all(Object.keys(S).map(async k => { try { S[k] = (await fetchAll(k)).map(r => ({ id: r.id, ...r.data })); } catch (e) { if (k === 'sorders') { soMissing = true; tblErr[k] = e; S[k] = []; } else if (k === 'settings') { setMissing = true; tblErr[k] = e; S[k] = []; } else throw e; } loaded[k] = true; }));
    clearTimeout(t); loadFailed = false;
  } catch (e) { console.error(e); loadFailed = true; }
  reindex(); route();
  const ch = sb.channel('wms-live');
  for (const k of Object.keys(S).filter(k => !(k === 'sorders' && soMissing) && !(k === 'settings' && setMissing))) ch.on('postgres_changes', { event: '*', schema: 'public', table: TBL(k) }, p => {
    if (p.eventType === 'DELETE') S[k] = S[k].filter(x => x.id !== p.old.id); else upsertLocal(k, p.new);
    schedule();
  });
  ch.subscribe();
}
async function boot() {
  window.addEventListener('hashchange', route);
  const cfg = window.WMS_CONFIG;
  if (!cfg || !cfg.SUPABASE_URL || /ISI_|YOUR_/i.test(cfg.SUPABASE_URL + cfg.SUPABASE_ANON_KEY) || !window.supabase) {
    $('#main').innerHTML = '<div class="card"><h2>Konfigurasi belum diisi</h2><p class="mut">Buka file <b>config.js</b> lalu isi <b>SUPABASE_URL</b> dan <b>SUPABASE_ANON_KEY</b> sesuai panduan.</p></div>'; $('#role').textContent = 'Belum dikonfigurasi'; return;
  }
  let base = '';
  try { const u = new URL(String(cfg.SUPABASE_URL).trim()); base = u.origin; } catch (e) { }
  if (!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(base)) {
    $('#main').innerHTML = '<div class="card"><h2>SUPABASE_URL di config.js tidak benar</h2><p class="mut">Isi dengan <b>Project URL</b> berbentuk <code>https://xxxxxxxx.supabase.co</code> (dari Project Settings &gt; API), bukan alamat dashboard dan tanpa tambahan di belakangnya.</p></div>'; $('#role').textContent = 'Konfigurasi salah'; return;
  }
  sb = window.supabase.createClient(base, String(cfg.SUPABASE_ANON_KEY).trim());
  const { data: { session } } = await sb.auth.getSession();
  if (session) start(session); else { $('#role').textContent = 'Belum masuk'; showLogin(); }
}
boot();
