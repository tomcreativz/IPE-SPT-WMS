<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="config.js"></script>

<style>
:root{--ink:#16181d;--ink2:#2a2d35;--mut:#6b7280;--line:#e5e7eb;--bg:#f4f5f7;--card:#fff;--y:#f5b400;--y2:#ffd45c;--ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;--info:#1d4ed8;--infobg:#dbeafe;--r:10px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:Inter,system-ui,sans-serif;font-size:14px;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100vh}
#side{width:232px;background:var(--ink);color:#d1d5db;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 16px 14px;border-bottom:1px solid #2b2e36}
.brand b{display:block;color:#fff;font-size:13px;letter-spacing:.3px;line-height:1.25}
.brand span{display:inline-block;margin-top:6px;background:var(--y);color:var(--ink);font-weight:700;font-size:10.5px;padding:2px 7px;border-radius:4px;letter-spacing:.5px}
nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
nav a{color:#c3c7cf;text-decoration:none;padding:9px 12px;border-radius:7px;font-weight:500;display:flex;align-items:center;gap:10px}
nav a i{width:8px;height:8px;border-radius:2px;background:#4b5160;flex-shrink:0}
nav a:hover{background:#22252c;color:#fff}
nav a.on{background:var(--y);color:var(--ink);font-weight:600}
nav a.on i{background:var(--ink)}
nav .sep{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#6b7280;padding:12px 12px 4px}
#content{flex:1;min-width:0}
#top{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;gap:12px}
#top h1{font-size:18px;margin:0;font-weight:700}
.role{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--infobg);color:var(--info);white-space:nowrap}
#main{padding:22px 24px 60px;max-width:1320px}
.banner{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.banner.info{background:var(--infobg);color:var(--info)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat small{color:var(--mut);font-weight:500;display:block;margin-bottom:6px}
.stat b{font-size:24px;letter-spacing:-.5px}
.stat.hl{border-left:4px solid var(--y)}
.stat.bad{border-left:4px solid #ef4444}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:1000px){.row2{grid-template-columns:1fr}}
h2{font-size:14px;margin:0 0 12px;font-weight:700}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .grow{flex:1}
.bar input,.bar select{padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;background:#fff;min-width:0}
.bar input[type=search]{min-width:220px}
.btn{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:#f3f4f6}
.btn.primary{background:var(--y);border-color:var(--y);color:var(--ink)}
.btn.primary:hover{background:#e5a800}
.btn.danger{background:#dc2626;border-color:#dc2626;color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--info)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tw{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse}
th{background:#fafafa;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid #f0f1f3;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fcfcfd}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.act{white-space:nowrap;text-align:right}
.mut{color:var(--mut)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.info{background:var(--infobg);color:var(--info)}.chip.gray{background:#eceef1;color:#4b5563}
.empty{padding:36px 16px;text-align:center;color:var(--mut)}
.in{color:var(--ok);font-weight:600}.out{color:var(--bad);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(15,17,22,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:860px}
.modal h3{margin:0 0 14px;font-size:17px}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.f{display:flex;flex-direction:column;gap:5px}
.f.s2{grid-column:span 2}
.f span{font-size:12px;font-weight:600;color:#4b5563}
.f input,.f select,.f textarea{padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;background:#fff;width:100%}
.f input:focus,.f select:focus,.f textarea:focus,.bar input:focus,.bar select:focus{outline:2px solid var(--y2);border-color:var(--y)}
.f input[disabled],.f select[disabled]{background:#f3f4f6}
.lines{margin-top:14px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lines .lh,.lines .lr{display:grid;gap:8px;padding:8px 10px;align-items:center}
.lines .lh{background:#fafafa;font-size:11.5px;text-transform:uppercase;color:var(--mut);font-weight:600}
.lines .lr{border-top:1px solid #f0f1f3}
.lines input{padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;width:100%}
.lines.tx .lh,.lines.tx .lr{grid-template-columns:1fr 90px 210px 32px}
.lines.po .lh,.lines.po .lr{grid-template-columns:1.6fr 80px 130px 1fr 32px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.f.s2{grid-column:span 1}.lines .lh{display:none}.lines.tx .lr,.lines.po .lr{grid-template-columns:1fr 1fr}}
.err{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:16px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:99;align-items:center}
#toast div{background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast div.err{background:#b91c1c}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px;margin-bottom:12px}
.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:500}
.prog{height:6px;background:#eceef1;border-radius:4px;overflow:hidden;min-width:70px}
.prog i{display:block;height:100%;background:var(--y)}
.chart{display:flex;align-items:flex-end;gap:14px;height:150px;padding-top:6px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.chart .bars{flex:1;display:flex;align-items:flex-end;gap:4px;width:100%;justify-content:center}
.chart .bars i{width:42%;max-width:26px;border-radius:4px 4px 0 0;min-height:2px}
.chart small{color:var(--mut);font-size:11px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:10px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#login{position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
#login .box{background:#fff;border-radius:14px;padding:28px;width:100%;max-width:380px}
#login h2{font-size:18px;margin:0 0 4px}#login p{margin:0 0 18px;color:var(--mut);font-size:13px}
#login .f{margin-bottom:12px}#login .btn{width:100%;padding:10px}
.top-r{display:flex;align-items:center;gap:10px}
@media(max-width:820px){#app{flex-direction:column}#side{width:100%;height:auto;position:static}nav{flex-direction:row;overflow-x:auto;padding:8px}nav a{white-space:nowrap}nav .sep{display:none}.brand{padding:12px 14px}#main{padding:16px 14px 50px}#top{padding:12px 14px}}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><b>PT INDONESIA PRIMA EQUIPMENT</b><span>CABANG SAMPIT · JCB</span></div>
    <nav id="nav"></nav>
  </aside>
  <div id="content">
    <header id="top"><h1 id="title">Dashboard</h1><span class="top-r"><span class="mut" id="who" style="font-size:12px"></span><span class="role" id="role">Memuat…</span><button class="btn sm" id="logout" hidden>Keluar</button></span></header>
    <main id="main"><div class="empty">Memuat data…</div></main>
  </div>
</div>
<div id="login" hidden></div>
<div id="toast"></div>
<datalist id="plist"></datalist>
<datalist id="catlist"></datalist>
<datalist id="custlist"></datalist>
<datalist id="srclist"></datalist>
<datalist id="polist"></datalist>
<datalist id="plantlist"></datalist>
<datalist id="ekspList"></datalist>

<script>
/* ============ util ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = n => new Intl.NumberFormat('id-ID').format(n || 0);
const fmtRp = n => 'Rp ' + fmtN(Math.round(n || 0));
const fmtD = iso => { if (!iso) return ''; const [y, m, d] = iso.slice(0, 10).split('-'); return `${d}/${m}/${y}`; };
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const byText = (a, b) => String(a || '').localeCompare(String(b || ''), 'id');
function toast(msg, type) {
  const w = $('#toast'), d = document.createElement('div');
  d.textContent = msg; if (type === 'err') d.className = 'err'; w.appendChild(d);
  setTimeout(() => d.remove(), type === 'err' ? 6000 : 2800);
}

/* ============ state ============ */
const S = { parts: [], movements: [], customers: [], suppliers: [], pos: [], sorders: [] };
let soMissing = false, dataVer = 0, dm = new Map(), incoming = new Map(), soReq = new Map();
const loaded = {};
let sb = null, db = null, uid = null, myRole = '', myEmail = '', PROFILES = [];
let canWrite = false, canPO = false, isFull = false, loadFailed = false;
let stockMap = new Map(), partMap = new Map(), custMap = new Map(), suppMap = new Map(), poMap = new Map(), commit = new Map(), delivIdx = new Map(), reqIdx = new Map();
const names = {};
const F = { dash: { year: new Date().getFullYear() }, so: { q: '', per: '', st: '' }, cek: { text: '' }, rep: { ym: new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 7), q: '', mv: '', urg: '', active: true }, all: { q: '', from: '', to: '', kind: '' }, soh: { ym: new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 7), q: '', active: true }, parts: { q: '', cat: '', st: '' }, in: { q: '', from: '', to: '', kind: '' }, out: { q: '', from: '', to: '', kind: '' },
  kartu: { part: '', from: '', to: '' }, cust: { q: '' }, supp: { q: '' }, po: { q: '', st: '' } };

const IN_TYPES = ['IN', 'RETURN CUSTOMER', 'SALDO AWAL', 'KOREKSI (+)'];
const OUT_TYPES = ['SOLD CUSTOMER', 'WH03 SERVICE', 'BUNDLING', 'IPE BJM', 'IPE SMD', 'IPE BPP', 'IPE PTK', 'IPE SBY', 'IPE JKT', 'IPE PKY', 'PART DAMAGE', 'PART RETURN', 'FUCHS', 'KOREKSI (-)'];
const EKSP = ['YML', 'MJM', 'TIM SERVICE', 'TIM BC', 'TIM HO', 'TIM WH', 'DIJEMPUT', 'DIANTAR', 'DHL', 'FEDEX', 'J&T EXPRESS', 'J&T CARGO', 'JNE', 'TIKI', 'POS', 'LION PARCEL', 'DUTA CARGO', 'PANDU', 'PSM', 'PSSR', 'TRAVEL'];
const CATS = ['Filter', 'Engine', 'Hidrolik', 'Transmisi', 'Undercarriage', 'Kelistrikan', 'Ground Engaging Tools', 'Seal & Gasket', 'Pelumas', 'Lain-lain'];

function reindex() {
  stockMap = new Map();
  for (const m of S.movements) stockMap.set(m.partId, (stockMap.get(m.partId) || 0) + (m.dir === 'in' ? m.qty : -m.qty));
  partMap = new Map(S.parts.map(p => [p.id, p]));
  custMap = new Map(S.customers.map(p => [p.id, p]));
  suppMap = new Map(S.suppliers.map(p => [p.id, p]));
  poMap = new Map(S.pos.map(p => [p.id, p]));
  delivIdx = new Map(); reqIdx = new Map();
  for (const m of S.movements) {
    const ref = String(m.poRef || poMap.get(m.poId)?.poNo || '').trim().toUpperCase(); if (!ref) continue;
    const k = ref + '|' + m.partId; const T = m.dir === 'out' ? delivIdx : reqIdx; T.set(k, (T.get(k) || 0) + m.qty);
  }
  commit = new Map();
  for (const po of S.pos) { if (po.status === 'batal') continue; const ref = String(po.poNo || '').trim().toUpperCase(); for (const it of po.items || []) { const sisa = Math.max(0, it.qty - (delivIdx.get(ref + '|' + it.partId) || 0)); if (sisa) commit.set(it.partId, (commit.get(it.partId) || 0) + sisa); } }
  dataVer++;
  dm = new Map();
  for (const m of S.movements) { if (m.dir !== 'out' || !DELIV_KINDS.includes(m.kind)) continue; const ym = (m.date || '').slice(0, 7); let a = dm.get(m.partId); if (!a) { a = new Map(); dm.set(m.partId, a); } a.set(ym, (a.get(ym) || 0) + m.qty); }
  soReq = new Map(); incoming = new Map();
  for (const l of S.sorders) { if (l.done) continue; const k = String(l.period || '').trim().toUpperCase() + '|' + l.partId; soReq.set(k, (soReq.get(k) || 0) + l.req); }
  for (const [k, req] of soReq) { const sisa = Math.max(0, req - (reqIdx.get(k) || 0)); if (sisa) { const pid = k.slice(k.lastIndexOf('|') + 1); incoming.set(pid, (incoming.get(pid) || 0) + sisa); } }
  const optsOf = a => [...new Set(a.filter(Boolean))].map(v => `<option value="${esc(v)}"></option>`).join('');
  $('#custlist').innerHTML = optsOf(S.customers.map(c => c.name).sort(byText));
  $('#srclist').innerHTML = optsOf(['IPE SGP', ...S.suppliers.map(c => c.name).sort(byText)]);
  $('#polist').innerHTML = optsOf([...S.pos.filter(p => p.status !== 'batal').map(p => p.poNo), ...S.sorders.map(l => l.period)]);
  $('#plantlist').innerHTML = optsOf([...S.customers.flatMap(c => String(c.plants || '').split(',').map(x => x.trim())), ...S.pos.map(p => p.plant)]);
  $('#ekspList').innerHTML = optsOf(EKSP);
  const dl2 = $('#plist'); dl2.innerHTML = S.parts.slice().sort((a, b) => byText(a.partNo, b.partNo)).map(p => `<option value="${esc(partLabel(p))}"></option>`).join('');
  const cats = [...new Set([...CATS, ...S.parts.map(p => p.category).filter(Boolean)])];
  $('#catlist').innerHTML = cats.map(c => `<option value="${esc(c)}"></option>`).join('');
}
const stock = id => stockMap.get(id) || 0;
const partLabel = p => `${p.partNo} — ${p.name}`;
function partFromText(t) {
  t = (t || '').trim(); if (!t) return null;
  const u = t.toUpperCase();
  return S.parts.find(p => partLabel(p) === t) || S.parts.find(p => p.partNo.toUpperCase() === u) || null;
}
function partStatus(p) {
  const s = stock(p.id);
  if (s <= 0) return { k: 'Habis', c: 'bad' };
  if (p.minStock > 0 && s <= p.minStock) return { k: 'Menipis', c: 'warn' };
  return { k: 'Aman', c: 'ok' };
}
function partyName(m) {
  if (m.party) return m.party;
  if (m.partyType === 'customer') return custMap.get(m.partyId)?.name || '';
  if (m.partyType === 'supplier') return suppMap.get(m.partyId)?.name || '';
  return '';
}
function poInfo(po) {
  const ref = String(po.poNo || '').trim().toUpperCase();
  const lines = (po.items || []).map(it => {
    const key = ref + '|' + it.partId; const d = delivIdx.get(key) || 0, rq = reqIdx.get(key) || 0;
    const sisa = Math.max(0, it.qty - d), stk = stock(it.partId), free = stk - (commit.get(it.partId) || 0);
    let st;
    if (po.status === 'batal') st = { k: 'Batal', c: 'gray' };
    else if (sisa === 0) st = { k: 'Terkirim', c: 'ok' };
    else if (it.ket === 'C' || free >= 0) st = { k: 'LENGKAP', c: 'ok' };
    else st = { k: 'KURANG', c: 'bad' };
    const kurang = st.k === 'KURANG' ? Math.min(sisa, -free) : 0;
    return { ...it, d, sisa, stk, free, st, kurang, dv: sisa === 0 ? 'DELIVERED' : rq > 0 ? 'REQ DONE' : 'BELUM' };
  });
  let ord = 0, del = 0, val = 0;
  for (const l of lines) { ord += l.qty; del += Math.min(l.d, l.qty); val += l.qty * (partMap.get(l.partId)?.price || 0); }
  const short = lines.filter(l => l.st.k === 'KURANG').length;
  let st = { k: 'Terbuka', c: 'info' };
  if (po.status === 'batal') st = { k: 'Dibatalkan', c: 'gray' };
  else if (lines.length && lines.every(l => l.sisa === 0)) st = { k: 'Selesai', c: 'ok' };
  else if (del > 0) st = { k: 'Sebagian', c: 'warn' };
  return { lines, d: new Map(lines.map(l => [l.partId, l.d])), ord, del, val, short, st, open: st.k === 'Terbuka' || st.k === 'Sebagian' };
}

/* ============ csv / pdf ============ */
function toCSV(rows) {
  return '﻿sep=;\r\n' + rows.map(r => r.map(v => { v = v == null ? '' : String(v); return /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';')).join('\r\n');
}
async function saveFile(filename, data) {
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: /\.csv$/.test(filename) ? 'text/csv;charset=utf-8' : 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000); toast('File diunduh: ' + filename);
  } catch (e) { toast('Gagal mengunduh file', 'err'); }
}
function exportCSV(name, rows) { saveFile(`${name}-${today()}.csv`, toCSV(rows)); }
function pdfDoc(title, subtitle) {
  const J = window.jspdf && window.jspdf.jsPDF;
  if (!J) { toast('Pustaka PDF belum termuat, coba lagi sebentar', 'err'); return null; }
  const doc = new J({ unit: 'mm', format: 'a4' });
  doc.setFont('helvetica', 'bold').setFontSize(13).text('PT INDONESIA PRIMA EQUIPMENT', 14, 14);
  doc.setFont('helvetica', 'normal').setFontSize(9).setTextColor(90).text('Cabang Sampit - Mitra Alat Berat JCB', 14, 19);
  doc.setDrawColor(245, 180, 0).setLineWidth(0.8).line(14, 22, 196, 22);
  doc.setTextColor(0).setFont('helvetica', 'bold').setFontSize(12).text(title, 14, 30);
  if (subtitle) doc.setFont('helvetica', 'normal').setFontSize(9).setTextColor(90).text(subtitle, 14, 35);
  doc.setTextColor(0);
  return doc;
}
function pdfTable(doc, startY, head, body, opts = {}) {
  doc.autoTable({ startY, head: [head], body, styles: { fontSize: 8.5, cellPadding: 1.8 }, headStyles: { fillColor: [22, 24, 29], textColor: 255 }, margin: { left: 14, right: 14 }, ...opts });
  return doc.lastAutoTable.finalY;
}
const pdfSafe = s => String(s ?? '').replace(/[—–]/g, '-').replace(/[^\x20-\x7e -ÿ]/g, '');

/* ============ modal ============ */
function modal(html, { wide, onClose } = {}) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(ov);
  const close = () => { ov.remove(); document.removeEventListener('keydown', esc_); onClose && onClose(); };
  const esc_ = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', esc_);
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
  return { el: ov.firstElementChild, close };
}

const DELIV_KINDS = ['SOLD CUSTOMER', 'WH03 SERVICE', 'BUNDLING'];
const BULAN = ['JAN', 'FEB', 'MAR', 'APR', 'MEI', 'JUN', 'JUL', 'AGS', 'SEP', 'OKT', 'NOV', 'DES'];
const curYM = () => today().slice(0, 7);
function monthsBack(ym, n) {
  let [y, m] = ym.split('-').map(Number); const out = [];
  for (let i = 0; i < n; i++) { out.unshift(`${y}-${String(m).padStart(2, '0')}`); m--; if (m === 0) { m = 12; y--; } }
  return out;
}
const r1 = x => Math.round(x * 10) / 10;
function analyze(ym) {
  const win = monthsBack(ym, 6), R = new Map();
  for (const p of S.parts) {
    const mm = dm.get(p.id) || new Map(), vals = win.map(k => mm.get(k) || 0);
    const T = vals.reduce((a, b) => a + b, 0), active = vals.filter(v => v > 0).length;
    const soh = stock(p.id), free = soh - (commit.get(p.id) || 0);
    let mv = '';
    if (soh <= 0 && active === 0) mv = ''; else if (soh > 0 && active === 0) mv = 'DEADSTOCK'; else if (active > 3) mv = 'FAST'; else if (active === 3) mv = 'MEDIUM'; else mv = 'SLOW';
    const ship = p.ship ?? 1, ss = p.ss ?? 1, freq = p.freq ?? 1, avg = Math.ceil(T / 6);
    const min = (ship + ss) * avg, max = Math.ceil(ship + ss + freq) * avg, inc = incoming.get(p.id) || 0, avail = free + inc;
    const sug = T === 0 ? 0 : (avail >= max ? 0 : (avail <= min ? Math.max(max - avail, 1) : 0));
    const lasts = avg === 0 ? null : r1(avail / avg);
    let urg;
    if (T === 0) urg = 'TIDAK BERGERAK'; else if (avail >= max) urg = 'STOK CUKUP'; else if (lasts < ship + ss) urg = 'ORDER SEKARANG!'; else if (lasts < ship + ss + 1) urg = 'SEGERA ORDER'; else urg = 'AMAN';
    R.set(p.id, { p, vals, T, active, soh, free, mv, avg, min, max, inc, avail, sug, cover: avg === 0 ? null : r1(soh / avg), lasts, urg });
  }
  return R;
}

function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const lines0 = text.split(/\r?\n/);
  if (/^sep=/i.test(lines0[0])) lines0.shift();
  text = lines0.join('\n');
  const first = text.split('\n')[0] || '';
  const delim = [';', '\t', ','].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}

    const po = findPO(); if (!po) return; const inf = poInfo(po); ls.innerHTML = '';
    for (const l of inf.lines) if (l.sisa > 0) addLine(l.partId, Math.min(l.sisa, Math.max(0, stock(l.partId))) || l.sisa);
    if (!ls.children.length) addLine();
    if (!E.party.value) E.party.value = custMap.get(po.customerId)?.name || '';
  }
  const findSO = () => { const v = E.poRef.value.trim().toUpperCase(); return v ? S.sorders.filter(l => String(l.period || '').trim().toUpperCase() === v) : []; };
  const togglePO = () => { $('#fillpo', el).hidden = !((dir === 'out' && findPO()) || (dir === 'in' && findSO().length)); };
  E.poRef.addEventListener('input', togglePO);
  ls.addEventListener('input', e => { if (e.target.classList.contains('lp')) info(e.target.parentElement); });
  if (preset.lines && preset.lines.length) preset.lines.forEach(l => addLine(l.partId, l.qty)); else addLine();
  togglePO();
  el.addEventListener('click', async e => {

      const lines = [...ls.children].map(r => ({ p: partFromText($('.lp', r).value), raw: $('.lp', r).value.trim(), q: parseFloat($('.lq', r).value) })).filter(l => l.raw || l.q);
      if (!lines.length) { err.textContent = 'Isi minimal satu baris spare part.'; return; }
      for (const l of lines) { if (!l.p) { err.textContent = `Part “${l.raw}” tidak ditemukan. Pilih dari daftar yang muncul.`; return; } if (!(l.q > 0)) { err.textContent = `Qty untuk ${l.p.partNo} harus lebih dari 0.`; return; } }
      const sum = new Map(); for (const l of lines) sum.set(l.p.id, (sum.get(l.p.id) || 0) + l.q);
      if (dir === 'out') for (const [id, q] of sum) if (q > stock(id)) { const p = partMap.get(id); err.textContent = `Stok ${p.partNo} tidak cukup: tersedia ${fmtN(stock(id))} ${p.unit}, diminta ${fmtN(q)}.`; return; }
      const v = Object.fromEntries(new FormData(f)); const party = (v.party || '').trim();
      const pl = (dir === 'in' ? S.suppliers : S.customers).find(x => x.name.toLowerCase() === party.toLowerCase());
      const po = findPO();

      const ok = await guarded(async () => {
        for (const l of lines) await db.collection('movements').add({ docNo: v.docNo.trim(), date: v.date, partId: l.p.id, qty: l.q, dir, kind: v.kind, party, partyId: pl ? pl.id : '', poRef: (v.poRef || '').trim(), poId: po ? po.id : '', ekspedisi: (v.ekspedisi || '').trim(), awb: (v.awb || '').trim(), note: (v.note || '').trim(), by: uid, at: nowISO() });
      });
      if (ok) { m.close(); toast(`${lines.length} baris tersimpan`); } else b.disabled = false;
    }

}

/* ============ SOH BULANAN ============ */
const SOH_OUT = [['sold', 'SOLD CUSTOMER', 'Sold Customer'], ['bjm', 'IPE BJM', 'IPE BJM'], ['smd', 'IPE SMD', 'IPE SMD'], ['bpp', 'IPE BPP', 'IPE BPP'], ['ptk', 'IPE PTK', 'IPE PTK'], ['sby', 'IPE SBY', 'IPE SBY'], ['jkt', 'IPE JKT', 'IPE JKT'], ['pky', 'IPE PKY', 'IPE PKY'], ['wh', 'WH03 SERVICE', 'WH03 Service'], ['bund', 'BUNDLING', 'Bundling'], ['dmg', 'PART DAMAGE', 'Part Damage']];
function computeSOH(ym) {
  const start = ym + '-01', end = ym + '-31'; const R = new Map();
  const get = id => { let r = R.get(id); if (!r) { r = { awal: 0, in: 0, other: 0 }; SOH_OUT.forEach(o => r[o[0]] = 0); R.set(id, r); } return r; };
  const byKind = new Map(SOH_OUT.map(o => [o[1], o[0]]));
  for (const m of S.movements) {
    if (!partMap.has(m.partId)) continue; const d = m.date || ''; if (d > end) continue;
    const r = get(m.partId);
    if (d < start) { r.awal += m.dir === 'in' ? m.qty : -m.qty; continue; }
    if (m.dir === 'in') { if (isOpening(m)) r.awal += m.qty; else r.in += m.qty; }
    else { const k = byKind.get(m.kind); if (k) r[k] += m.qty; else r.other += m.qty; }
  }
  return R;
}
function viewSOH() {
  let rows = [], page = 0; const PS = 100;
  const st = F.soh;
  return {
    shell: `${loadNoteHTML}
    <div class="bar">
      <label class="mut">Bulan <input type="month" id="ym" value="${st.ym}"></label>
      <input type="search" id="q" placeholder="Cari part number / deskripsi / bin…" value="${esc(st.q)}">
      <label class="mut" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="act" ${st.active ? 'checked' : ''}> Hanya yang ada stok / bergerak</label>
      <span class="grow"></span><button class="btn" data-act="csv">Export CSV</button>
    </div><div id="sohcards"></div>
    <div class="tw"><div id="tbl"></div></div><div class="bar" style="margin-top:10px;justify-content:center" id="pg"></div>`,
    input(e) {
      if (e.target.id === 'ym') { if (!e.target.value) return; st.ym = e.target.value; }
      if (e.target.id === 'q') st.q = e.target.value;
      if (e.target.id === 'act') st.active = e.target.checked;
      page = 0; this.fill();
    },
    act(a) {
      if (a === 'prev') { page = Math.max(0, page - 1); this.fill(true); }
      if (a === 'next') { page++; this.fill(true); }
      if (a === 'csv') {
        const hdr = ['NO', 'PART NUMBER', 'SUPRESSION', 'DESCRIPTION', 'BIN LOC', 'STOCK AWAL BULAN', 'STOCK FREE', 'IN', 'COMMITED', ...SOH_OUT.map(o => o[2].toUpperCase()), 'LAINNYA', 'TOTAL OUT', 'STOCK AKHIR', 'TOTAL DELIVERY'];
        exportCSV('SOH-' + st.ym, [hdr, ...rows.map((r, i) => [i + 1, r.p.partNo, r.p.supersession || '', r.p.name, r.p.location || '', r.awal, r.free, r.in, r.com, ...SOH_OUT.map(o => r[o[0]]), r.other, r.out, r.akhir, r.deliv])]);
      }
    },
    fill(keep) {
      const R = computeSOH(st.ym), q = st.q.toLowerCase();
      rows = S.parts.slice().sort((a, b) => byText(a.partNo, b.partNo)).map(p => {
        const r = R.get(p.id) || { awal: 0, in: 0, other: 0, ...Object.fromEntries(SOH_OUT.map(o => [o[0], 0])) };
        const out = SOH_OUT.reduce((s, o) => s + r[o[0]], 0) + r.other, akhir = r.awal + r.in - out, com = commit.get(p.id) || 0;
        return { p, ...r, out, akhir, com, free: akhir - com, deliv: r.sold + r.wh + r.bund };
      }).filter(r => (!st.active || r.awal || r.in || r.out || r.akhir || r.com) && (!q || [r.p.partNo, r.p.name, r.p.location, r.p.supersession].join(' ').toLowerCase().includes(q)));
      const tot = rows.reduce((t, r) => { t.awal += r.awal; t.in += r.in; t.out += r.out; t.akhir += r.akhir; t.deliv += r.deliv; t.val += Math.max(0, r.akhir) * (r.p.price || 0); return t; }, { awal: 0, in: 0, out: 0, akhir: 0, deliv: 0, val: 0 });
      $('#sohcards').innerHTML = `<div class="cards"><div class="card stat"><small>Stok awal bulan</small><b>${fmtN(tot.awal)}</b></div><div class="card stat"><small>Total IN</small><b class="in">${fmtN(tot.in)}</b></div><div class="card stat"><small>Total OUT</small><b class="out">${fmtN(tot.out)}</b></div><div class="card stat hl"><small>Stok akhir</small><b>${fmtN(tot.akhir)}</b></div><div class="card stat"><small>Total delivery</small><b>${fmtN(tot.deliv)}</b></div><div class="card stat"><small>Nilai stok akhir</small><b style="font-size:19px">${fmtRp(tot.val)}</b></div></div>`;
      const pages = Math.max(1, Math.ceil(rows.length / PS)); if (page >= pages) page = pages - 1;
      const slice = rows.slice(page * PS, page * PS + PS);
      $('#tbl').innerHTML = rows.length ? `<table><thead><tr><th class="n">No</th><th>Part Number</th><th>Description</th><th>Bin</th><th class="n">Stok Awal</th><th class="n">Stock Free</th><th class="n">In</th><th class="n">Commited</th>${SOH_OUT.map(o => `<th class="n">${o[2]}</th>`).join('')}<th class="n">Lainnya</th><th class="n">Total Out</th><th class="n">Stok Akhir</th><th class="n">Total Delivery</th></tr></thead><tbody>${slice.map((r, i) => `<tr><td class="n mut">${page * PS + i + 1}</td><td class="mono"><b>${esc(r.p.partNo)}</b>${r.p.supersession ? `<div class="mut" style="font-size:11px">→ ${esc(r.p.supersession)}</div>` : ''}</td><td>${esc(r.p.name)}</td><td>${esc(r.p.location || '')}</td><td class="n">${fmtN(r.awal)}</td><td class="n ${r.free < 0 ? 'out' : ''}"><b>${fmtN(r.free)}</b></td><td class="n in">${r.in ? fmtN(r.in) : ''}</td><td class="n">${r.com ? fmtN(r.com) : ''}</td>${SOH_OUT.map(o => `<td class="n">${r[o[0]] ? fmtN(r[o[0]]) : ''}</td>`).join('')}<td class="n">${r.other ? fmtN(r.other) : ''}</td><td class="n out">${r.out ? fmtN(r.out) : ''}</td><td class="n"><b>${fmtN(r.akhir)}</b></td><td class="n">${r.deliv ? fmtN(r.deliv) : ''}</td></tr>`).join('')}</tbody></table>` : empty(S.parts.length ? 'Tidak ada part yang cocok.' : (loaded.parts ? 'Belum ada spare part.' : 'Memuat…'));
      $('#pg').innerHTML = rows.length > PS ? `<button class="btn sm" data-act="prev" ${page === 0 ? 'disabled' : ''}>‹ Sebelumnya</button><span class="mut">Halaman ${page + 1} / ${pages} · ${fmtN(rows.length)} part</span><button class="btn sm" data-act="next" ${page >= pages - 1 ? 'disabled' : ''}>Berikutnya ›</button>` : `<span class="mut">${fmtN(rows.length)} part</span>`;
    }
  };
}

  const rows = S.movements.filter(m => m.partId === partId).sort((a, b) => (a.date + (a.at || '')).localeCompare(b.date + (b.at || '')));
  let bal = 0; return rows.map(m => { const i = m.dir === 'in' ? m.qty : 0, o = m.dir === 'out' ? m.qty : 0; bal += i - o; return { ...m, i, o, bal }; });
}

function analysisNow() { const ym = curYM(); if (_an.ver !== dataVer || _an.ym !== ym) _an = { ver: dataVer, ym, v: analyze(ym) }; return _an.v; }

/* ============ LAPORAN RE-ORDER ============ */
function viewReorder() {
  let rows = [], page = 0; const PS = 100, st = F.rep;
  return {
    shell: `${loadNoteHTML}<div class="bar">
      <label class="mut">Per bulan <input type="month" id="ym" value="${st.ym}"></label>
      <input type="search" id="q" placeholder="Cari part number / deskripsi / model…" value="${esc(st.q)}">
      <select id="mv"><option value="">Semua movement</option>${['FAST', 'MEDIUM', 'SLOW', 'DEADSTOCK'].map(s => `<option ${st.mv === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
      <select id="urg"><option value="">Semua urgensi</option>${['ORDER SEKARANG!', 'SEGERA ORDER', 'AMAN', 'STOK CUKUP', 'TIDAK BERGERAK'].map(s => `<option ${st.urg === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
      <label class="mut" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="act" ${st.active ? 'checked' : ''}> Sembunyikan yang tidak aktif</label>
      <span class="grow"></span><button class="btn" data-act="csv">Export CSV</button>${canWrite ? '<button class="btn primary" data-act="mkso">Buat Stock Order dari saran</button>' : ''}</div>
      <p class="mut" style="margin:-4px 0 12px;font-size:12.5px">Window analisis: 6 bulan sampai bulan terpilih. MIN = (SHIP + SS) × rata-rata, MAX = (SHIP + SS + FREQ) × rata-rata. SHIP, SS, FREQ (dalam bulan) diatur per part di Database Spare Part (default 1). Total available = stock free + incoming Stock Order.</p>
    <div class="tw"><div id="tbl"></div></div><div class="bar" style="margin-top:10px;justify-content:center" id="pg"></div>`,
    input(e) {
      const k = { ym: 'ym', q: 'q', mv: 'mv', urg: 'urg' }[e.target.id]; if (k) { if (k === 'ym' && !e.target.value) return; st[k] = e.target.value; }
      if (e.target.id === 'act') st.active = e.target.checked; page = 0; this.fill();
    },
    act(a) {
      if (a === 'prev') { page = Math.max(0, page - 1); this.fill(); } if (a === 'next') { page++; this.fill(); }
      if (a === 'mkso') { const lines = rows.filter(r => r.sug > 0).slice(0, 150).map(r => ({ partId: r.p.id, qty: r.sug })); if (!lines.length) { toast('Tidak ada saran re-order pada filter ini.', 'err'); return; } soForm({ lines }); }
      if (a === 'csv') { const yr = +st.ym.slice(0, 4); exportCSV('laporan-reorder-' + st.ym, [['PART NUMBER', 'DESCRIPTION', 'MODEL', 'SOH', 'STOK FREE', 'PRICE', ...BULAN.map(b => b + ' ' + yr), 'SUM/6 MONTH', 'AVRG 6M', 'MIN', 'MAX', 'MOVEMENT', 'INCOMING', 'TOTAL AVAILABLE', 'RE-ORDER SUGGESTION', 'SHIP', 'SS', 'FREQ', 'BULAN BERTAHAN', 'STATUS URGENSI'],
        ...rows.map(r => [r.p.partNo, r.p.name, r.p.model, r.soh, r.free, r.p.price, ...yearVals(r.p.id, yr), r.T, r.avg, r.min, r.max, r.mv, r.inc, r.avail, r.sug, r.p.ship ?? 1, r.p.ss ?? 1, r.p.freq ?? 1, r.lasts ?? '∞', r.urg])]); }
    },
    fill() {
      const A = analyze(st.ym), q = st.q.toLowerCase(), yr = +st.ym.slice(0, 4);
      rows = [...A.values()].filter(r => (!st.active || r.mv || r.T > 0 || r.soh > 0 || r.inc > 0) && (!st.mv || r.mv === st.mv) && (!st.urg || r.urg === st.urg) && (!q || [r.p.partNo, r.p.name, r.p.model].join(' ').toLowerCase().includes(q))).sort((a, b) => byText(a.p.partNo, b.p.partNo));
      const pages = Math.max(1, Math.ceil(rows.length / PS)); if (page >= pages) page = pages - 1; const sl = rows.slice(page * PS, page * PS + PS);
      $('#tbl').innerHTML = rows.length ? `<table><thead><tr><th>Part number</th><th>Description</th><th>Model</th><th class="n">SOH</th><th class="n">Free</th><th class="n">Price</th>${BULAN.map(b => `<th class="n">${b}</th>`).join('')}<th class="n">Σ 6 bln</th><th class="n">Avg</th><th class="n">Min</th><th class="n">Max</th><th>Movement</th><th class="n">Incoming</th><th class="n">Avail</th><th class="n">Saran order</th><th class="n">Bln bertahan</th><th>Status urgensi</th></tr></thead><tbody>${sl.map(r => `<tr><td class="mono"><b>${esc(r.p.partNo)}</b></td><td>${esc(r.p.name)}</td><td>${esc(r.p.model || '')}</td><td class="n">${fmtN(r.soh)}</td><td class="n ${r.free < 0 ? 'out' : ''}">${fmtN(r.free)}</td><td class="n">${fmtN(r.p.price)}</td>${yearVals(r.p.id, yr).map(v => `<td class="n">${v ? fmtN(v) : ''}</td>`).join('')}<td class="n"><b>${fmtN(r.T)}</b></td><td class="n">${fmtN(r.avg)}</td><td class="n">${fmtN(r.min)}</td><td class="n">${fmtN(r.max)}</td><td>${r.mv ? `<span class="chip ${mvChip(r.mv)}">${r.mv}</span>` : ''}</td><td class="n">${r.inc ? fmtN(r.inc) : ''}</td><td class="n">${fmtN(r.avail)}</td><td class="n"><b>${r.sug ? fmtN(r.sug) : ''}</b></td><td class="n">${r.lasts == null ? '∞' : r.lasts}</td><td><span class="chip ${urgChip(r.urg)}">${r.urg}</span></td></tr>`).join('')}</tbody></table>` : empty(S.parts.length ? 'Tidak ada part yang cocok.' : (loaded.parts ? 'Belum ada spare part.' : 'Memuat…'));
      $('#pg').innerHTML = rows.length > PS ? `<button class="btn sm" data-act="prev" ${page === 0 ? 'disabled' : ''}>‹ Sebelumnya</button><span class="mut">Halaman ${page + 1} / ${pages} · ${fmtN(rows.length)} part</span><button class="btn sm" data-act="next" ${page >= pages - 1 ? 'disabled' : ''}>Berikutnya ›</button>` : `<span class="mut">${fmtN(rows.length)} part</span>`;
    }
  };
}
function yearVals(pid, yr) { const mm = dm.get(pid) || new Map(); return BULAN.map((_, i) => mm.get(`${yr}-${String(i + 1).padStart(2, '0')}`) || 0); }

/* ============ CEK STOK ============ */
function viewCek() {
  let out = [];
  return {
    shell: `<p class="mut" style="margin-top:0">Tempel daftar part dan qty yang diminta (satu baris satu part, pisahkan dengan spasi, tab, atau titik koma). Contoh: <span class="mono">320/A7170 6</span>. Dari Excel, salin dua kolom lalu tempel di sini.</p>
    <div class="card" style="margin-bottom:14px"><textarea id="paste" rows="6" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px" placeholder="320/A7170&#9;6&#10;336/E9730&#9;2">${esc(F.cek.text)}</textarea>
    <div class="bar" style="margin:10px 0 0"><button class="btn primary" data-act="run">Cek stok</button><button class="btn" data-act="clear">Bersihkan</button><span class="grow"></span><button class="btn" data-act="csv">Export CSV</button></div></div><div class="tw"><div id="tbl"></div></div>`,
    input(e) { if (e.target.id === 'paste') F.cek.text = e.target.value; },
    act(a) {
      if (a === 'clear') { F.cek.text = ''; $('#paste').value = ''; out = []; this.fill(); }
      if (a === 'run') { F.cek.text = $('#paste').value; this.fill(); }
      if (a === 'csv') exportCSV('cek-stok', [['PART NUMBER', 'DETAIL', 'REQ QTY', 'BIN LOC', 'STOK', 'STOK FREE', 'STOCK MIN', 'MOVEMENT', 'KETERANGAN'], ...out.map(r => [r.raw, r.p?.name || '', r.req, r.p?.location || '', r.p ? r.soh : '', r.p ? r.free : '', r.min ?? '', r.mv || '', r.ket])]);
    },
    fill() {
      const A = analysisNow(); out = [];
      for (const line of F.cek.text.split(/\r?\n/)) {
        const t = line.trim(); if (!t) continue;
        const mt = t.match(/^(.*?)[\s\t;]+(\d+(?:[.,]\d+)?)$/); const raw = (mt ? mt[1] : t).trim(), req = mt ? parseFloat(mt[2].replace(',', '.')) : 1;
        const p = partFromText(raw); const a = p && A.get(p.id);
        if (!p) { out.push({ raw, req, ket: 'TIDAK DITEMUKAN' }); continue; }
        out.push({ raw, p, req, soh: a.soh, free: a.free, min: a.min, mv: a.mv, ket: a.free >= req ? 'BISA' : (a.soh >= req ? 'TIDAK (stok tersisa untuk PO lain)' : 'TIDAK') });
      }
      $('#tbl').innerHTML = out.length ? `<table><thead><tr><th>Part number</th><th>Detail</th><th class="n">Req qty</th><th>Bin</th><th class="n">Stok</th><th class="n">Stok free</th><th class="n">Stock min</th><th>Movement</th><th>Keterangan</th></tr></thead><tbody>${out.map(r => `<tr><td class="mono"><b>${esc(r.p?.partNo || r.raw)}</b></td><td>${esc(r.p?.name || '')}</td><td class="n">${fmtN(r.req)}</td><td>${esc(r.p?.location || '')}</td><td class="n">${r.p ? fmtN(r.soh) : ''}</td><td class="n ${r.p && r.free < 0 ? 'out' : ''}">${r.p ? fmtN(r.free) : ''}</td><td class="n">${r.p ? fmtN(r.min) : ''}</td><td>${r.mv ? `<span class="chip ${mvChip(r.mv)}">${r.mv}</span>` : ''}</td><td><span class="chip ${r.ket === 'BISA' ? 'ok' : r.ket.startsWith('TIDAK (') ? 'warn' : 'bad'}">${esc(r.ket)}</span></td></tr>`).join('')}</tbody></table>` : empty('Belum ada yang dicek.');
    }
  };
}

/* ============ pengguna ============ */
const ROLES = [['staff', 'Staf Gudang (akses penuh)'], ['admin', 'Admin (buat PO & cek stok)'], ['viewer', 'Viewer (lihat saja)'], ['pending', 'Menunggu persetujuan']];
async function loadProfiles() {
  const { data, error } = await sb.from('profiles').select('id,email,full_name,role').order('email');
  if (error) { console.error(error); return; }
  PROFILES = data || [];
  for (const p of PROFILES) names[p.id] = p.full_name || p.email || '';
}
function viewUsers() {
  return {
    shell: `<div class="banner info">Akun baru dibuat di dashboard Supabase (Authentication → Users → Add user). Setelah akun itu pertama kali masuk, atur perannya di sini. Peran: <b>Staf Gudang</b> (akses penuh: input barang masuk/keluar, kelola data, hapus, atur pengguna), <b>Admin</b> (hanya membuat PO dan mengecek stok), <b>Viewer</b> (hanya lihat).</div><div class="tw"><div id="tbl"></div></div>`,
    async input(e) {
      const id = e.target.dataset.uid; if (!id) return;
      if (id === uid) { toast('Anda tidak bisa mengubah peran akun sendiri.', 'err'); this.fill(); return; }
      const { error } = await sb.from('profiles').update({ role: e.target.value }).eq('id', id);
      if (error) toast('Gagal mengubah peran: ' + error.message, 'err'); else toast('Peran diperbarui');
      await loadProfiles(); this.fill();
    },
    fill() {
      $('#tbl').innerHTML = PROFILES.length ? `<table><thead><tr><th>Email</th><th>Nama</th><th>Peran</th></tr></thead><tbody>${PROFILES.map(p => `<tr><td>${esc(p.email)}${p.id === uid ? ' <span class="chip gray">Anda</span>' : ''}</td><td>${esc(p.full_name || '')}</td><td><select data-uid="${p.id}" ${p.id === uid ? 'disabled' : ''}>${ROLES.map(r => `<option value="${r[0]}" ${p.role === r[0] ? 'selected' : ''}>${r[1]}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table>` : empty('Belum ada pengguna.');
    }
  };
}

/* ============ boot / supabase ============ */
function upsertLocal(k, r) {
  const o = { id: r.id, ...(r.data || {}) }; const i = S[k].findIndex(x => x.id === r.id);
  if (i >= 0) S[k][i] = o; else S[k].push(o);
}
function makeDb() {
  const chk = (error, rows, what) => { if (error) throw error; if (rows && !rows.length) throw new Error('Tidak punya izin untuk ' + what); };
  return {
    collection: k => ({
      async add(data) { const { data: r, error } = await sb.from(k).insert({ data }).select('id,data').single(); if (error) throw error; upsertLocal(k, r); schedule(); return { id: r.id }; }
    }),
    doc: path => {
      const [k, id] = path.split('/');
      return {
        async update(patch) {
          const cur = S[k].find(x => x.id === id) || {}; const { id: _i, ...rest } = cur; const nd = { ...rest, ...patch };
          const { data, error } = await sb.from(k).update({ data: nd, updated_at: nowISO() }).eq('id', id).select('id'); chk(error, data, 'mengubah data');
          upsertLocal(k, { id, data: nd }); schedule();
        },
        async delete() {
          const { data, error } = await sb.from(k).delete().eq('id', id).select('id'); chk(error, data, 'menghapus data');
          S[k] = S[k].filter(x => x.id !== id); schedule();
        }
      };
    }
  };
}
async function fetchAll(k) {
  const out = []; const step = 1000;
  for (let from = 0; ; from += step) {
    const { data, error } = await sb.from(k).select('id,data').order('created_at', { ascending: true }).order('id').range(from, from + step - 1);
    if (error) throw error; out.push(...data); if (data.length < step) break;
  }
  return out;
}
function showLogin(msg) {
  const L = $('#login'); L.hidden = false;
  L.innerHTML = `<form class="box" id="lf"><h2>WMS Gudang Spare Part</h2><p>PT Indonesia Prima Equipment · Cabang Sampit</p>
    ${fld('Email', 'email', { type: 'email', attrs: 'required autocomplete="username"' })}${fld('Password', 'password', { type: 'password', attrs: 'required autocomplete="current-password"' })}
    <div class="err" id="lerr">${esc(msg || '')}</div><button class="btn primary" type="submit">Masuk</button></form>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault(); const v = Object.fromEntries(new FormData(e.target)); const btn = $('button', e.target); btn.disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: v.email.trim(), password: v.password });
    if (error) {
      const m = String(error.message || '');
      let t = 'Gagal masuk: ' + m;
      if (/invalid login credentials/i.test(m)) t = 'Email atau password salah (atau akun belum dibuat di Supabase).';
      else if (/not confirmed/i.test(m)) t = 'Email belum dikonfirmasi. Di Supabase: Authentication > Users, buka akun ini lalu konfirmasi, atau buat ulang dengan "Auto Confirm User" dicentang.';
      else if (/api key|apikey|jwt/i.test(m)) t = 'Kunci API di config.js salah. Pakai anon/publishable key dari Project Settings > API.';
      else if (/failed to fetch|network|load failed/i.test(m)) t = 'Tidak bisa menghubungi Supabase. Periksa SUPABASE_URL di config.js dan koneksi internet.';
      $('#lerr').textContent = t; btn.disabled = false; return;
    }
    L.hidden = true; start(data.session);
  };
}
function showPending(email) {
  const L = $('#login'); L.hidden = false;
  L.innerHTML = `<div class="box"><h2>Menunggu persetujuan</h2><p>Akun <b>${esc(email)}</b> sudah terdaftar tetapi belum diberi peran. Minta admin gudang mengatur peran Anda, lalu muat ulang halaman ini.</p><button class="btn" id="lo">Keluar</button></div>`;
  $('#lo').onclick = async () => { await sb.auth.signOut(); location.reload(); };
}
let raf = 0;
function schedule() { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; reindex(); refresh(); }); }
async function start(session) {
  uid = session.user.id; myEmail = session.user.email;
  const { data: prof, error } = await sb.from('profiles').select('role,full_name').eq('id', uid).maybeSingle();
  if (error) { console.error(error); }
  myRole = prof ? prof.role : 'pending';
  if (!['admin', 'staff', 'viewer'].includes(myRole)) return showPending(myEmail);
  isFull = myRole === 'staff'; canWrite = isFull; canPO = isFull || myRole === 'admin';
  $('#role').textContent = { staff: 'Staf gudang', admin: 'Admin (PO & cek stok)', viewer: 'Hanya lihat' }[myRole];
  $('#who').textContent = myEmail; const lo = $('#logout'); lo.hidden = false;
  lo.onclick = async () => { await sb.auth.signOut(); location.reload(); };
  db = makeDb(); buildNav();
  await loadProfiles();
  const t = setTimeout(() => { loadFailed = true; refresh(); }, 10000);
  try {
    await Promise.all(Object.keys(S).map(async k => { try { S[k] = (await fetchAll(k)).map(r => ({ id: r.id, ...r.data })); } catch (e) { if (k === 'sorders') { soMissing = true; S[k] = []; } else throw e; } loaded[k] = true; }));
    clearTimeout(t); loadFailed = false;
  } catch (e) { console.error(e); loadFailed = true; }
  reindex(); route();
  const ch = sb.channel('wms-live');
  for (const k of Object.keys(S).filter(k => !(k === 'sorders' && soMissing))) ch.on('postgres_changes', { event: '*', schema: 'public', table: k }, p => {
    if (p.eventType === 'DELETE') S[k] = S[k].filter(x => x.id !== p.old.id); else upsertLocal(k, p.new);
    schedule();
  });
  ch.subscribe();
}
async function boot() {
  window.addEventListener('hashchange', route);
  const cfg = window.WMS_CONFIG;
  if (!cfg || !cfg.SUPABASE_URL || /ISI_|YOUR_/i.test(cfg.SUPABASE_URL + cfg.SUPABASE_ANON_KEY) || !window.supabase) {
    $('#main').innerHTML = '<div class="card"><h2>Konfigurasi belum diisi</h2><p class="mut">Buka file <b>config.js</b> lalu isi <b>SUPABASE_URL</b> dan <b>SUPABASE_ANON_KEY</b> sesuai panduan.</p></div>'; $('#role').textContent = 'Belum dikonfigurasi'; return;
  }
  let base = '';
  try { const u = new URL(String(cfg.SUPABASE_URL).trim()); base = u.origin; } catch (e) { }
  if (!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(base)) {
    $('#main').innerHTML = '<div class="card"><h2>SUPABASE_URL di config.js tidak benar</h2><p class="mut">Isi dengan <b>Project URL</b> berbentuk <code>https://xxxxxxxx.supabase.co</code> (dari Project Settings &gt; API), bukan alamat dashboard dan tanpa tambahan di belakangnya.</p></div>'; $('#role').textContent = 'Konfigurasi salah'; return;
  }
  sb = window.supabase.createClient(base, String(cfg.SUPABASE_ANON_KEY).trim());
  const { data: { session } } = await sb.auth.getSession();
  if (session) start(session); else { $('#role').textContent = 'Belum masuk'; showLogin(); }
}
boot();
</script>
