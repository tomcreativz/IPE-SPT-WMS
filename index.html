<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WMS Gudang Spare Part — PT Indonesia Prima Equipment Cabang Sampit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--ink:#16181d;--ink2:#2a2d35;--mut:#6b7280;--line:#e5e7eb;--bg:#f4f5f7;--card:#fff;--y:#f5b400;--y2:#ffd45c;--ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;--info:#1d4ed8;--infobg:#dbeafe;--r:10px}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;font-size:14px;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100vh}
#side{width:232px;background:var(--ink);color:#d1d5db;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 16px 14px;border-bottom:1px solid #2b2e36}
.brand b{display:block;color:#fff;font-size:13px;letter-spacing:.3px;line-height:1.25}
.brand span{display:inline-block;margin-top:6px;background:var(--y);color:var(--ink);font-weight:700;font-size:10.5px;padding:2px 7px;border-radius:4px;letter-spacing:.5px}
nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
nav a{color:#c3c7cf;text-decoration:none;padding:9px 12px;border-radius:7px;font-weight:500;display:flex;align-items:center;gap:10px}
nav a i{width:8px;height:8px;border-radius:2px;background:#4b5160;flex-shrink:0}
nav a:hover{background:#22252c;color:#fff}
nav a.on{background:var(--y);color:var(--ink);font-weight:600}
nav a.on i{background:var(--ink)}
nav .sep{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#6b7280;padding:12px 12px 4px}
#content{flex:1;min-width:0}
#top{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;gap:12px}
#top h1{font-size:18px;margin:0;font-weight:700}
.role{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--infobg);color:var(--info);white-space:nowrap}
#main{padding:22px 24px 60px;max-width:1320px}
.banner{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.banner.info{background:var(--infobg);color:var(--info)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat small{color:var(--mut);font-weight:500;display:block;margin-bottom:6px}
.stat b{font-size:24px;letter-spacing:-.5px}
.stat.hl{border-left:4px solid var(--y)}
.stat.bad{border-left:4px solid #ef4444}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:1000px){.row2{grid-template-columns:1fr}}
h2{font-size:14px;margin:0 0 12px;font-weight:700}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .grow{flex:1}
.bar input,.bar select{padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;background:#fff;min-width:0}
.bar input[type=search]{min-width:220px}
.btn{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:#f3f4f6}
.btn.primary{background:var(--y);border-color:var(--y);color:var(--ink)}
.btn.primary:hover{background:#e5a800}
.btn.danger{background:#dc2626;border-color:#dc2626;color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--info)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tw{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse}
th{background:#fafafa;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid #f0f1f3;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fcfcfd}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.act{white-space:nowrap;text-align:right}
.mut{color:var(--mut)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.info{background:var(--infobg);color:var(--info)}.chip.gray{background:#eceef1;color:#4b5563}
.empty{padding:36px 16px;text-align:center;color:var(--mut)}
.in{color:var(--ok);font-weight:600}.out{color:var(--bad);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(15,17,22,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:860px}
.modal h3{margin:0 0 14px;font-size:17px}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.f{display:flex;flex-direction:column;gap:5px}
.f.s2{grid-column:span 2}
.f span{font-size:12px;font-weight:600;color:#4b5563}
.f input,.f select,.f textarea{padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;background:#fff;width:100%}
.f input:focus,.f select:focus,.f textarea:focus,.bar input:focus,.bar select:focus{outline:2px solid var(--y2);border-color:var(--y)}
.f input[disabled],.f select[disabled]{background:#f3f4f6}
.lines{margin-top:14px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lines .lh,.lines .lr{display:grid;gap:8px;padding:8px 10px;align-items:center}
.lines .lh{background:#fafafa;font-size:11.5px;text-transform:uppercase;color:var(--mut);font-weight:600}
.lines .lr{border-top:1px solid #f0f1f3}
.lines input{padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;width:100%}
.lines.tx .lh,.lines.tx .lr{grid-template-columns:1fr 90px 130px 32px}
.lines.po .lh,.lines.po .lr{grid-template-columns:1fr 80px 120px 120px 32px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.f.s2{grid-column:span 1}.lines .lh{display:none}.lines.tx .lr,.lines.po .lr{grid-template-columns:1fr 1fr}}
.err{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:16px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:99;align-items:center}
#toast div{background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast div.err{background:#b91c1c}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px;margin-bottom:12px}
.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:500}
.prog{height:6px;background:#eceef1;border-radius:4px;overflow:hidden;min-width:70px}
.prog i{display:block;height:100%;background:var(--y)}
.chart{display:flex;align-items:flex-end;gap:14px;height:150px;padding-top:6px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.chart .bars{flex:1;display:flex;align-items:flex-end;gap:4px;width:100%;justify-content:center}
.chart .bars i{width:42%;max-width:26px;border-radius:4px 4px 0 0;min-height:2px}
.chart small{color:var(--mut);font-size:11px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:10px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#login{position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
#login .box{background:#fff;border-radius:14px;padding:28px;width:100%;max-width:380px}
#login h2{font-size:18px;margin:0 0 4px}#login p{margin:0 0 18px;color:var(--mut);font-size:13px}
#login .f{margin-bottom:12px}#login .btn{width:100%;padding:10px}
.top-r{display:flex;align-items:center;gap:10px}
@media(max-width:820px){#app{flex-direction:column}#side{width:100%;height:auto;position:static}nav{flex-direction:row;overflow-x:auto;padding:8px}nav a{white-space:nowrap}nav .sep{display:none}.brand{padding:12px 14px}#main{padding:16px 14px 50px}#top{padding:12px 14px}}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><b>PT INDONESIA PRIMA EQUIPMENT</b><span>CABANG SAMPIT · JCB</span></div>
    <nav id="nav"></nav>
  </aside>
  <div id="content">
    <header id="top"><h1 id="title">Dashboard</h1><span class="top-r"><span class="mut" id="who" style="font-size:12px"></span><span class="role" id="role">Memuat…</span><button class="btn sm" id="logout" hidden>Keluar</button></span></header>
    <main id="main"><div class="empty">Memuat data…</div></main>
  </div>
</div>
<div id="login" hidden></div>
<div id="toast"></div>
<datalist id="plist"></datalist>
<datalist id="catlist"></datalist>

<script>
/* ============ util ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = n => new Intl.NumberFormat('id-ID').format(n || 0);
const fmtRp = n => 'Rp ' + fmtN(Math.round(n || 0));
const fmtD = iso => { if (!iso) return ''; const [y, m, d] = iso.slice(0, 10).split('-'); return `${d}/${m}/${y}`; };
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const byText = (a, b) => String(a || '').localeCompare(String(b || ''), 'id');
function toast(msg, type) {
  const w = $('#toast'), d = document.createElement('div');
  d.textContent = msg; if (type === 'err') d.className = 'err'; w.appendChild(d);
  setTimeout(() => d.remove(), type === 'err' ? 6000 : 2800);
}

/* ============ state ============ */
const S = { parts: [], movements: [], customers: [], suppliers: [], pos: [] };
const loaded = {};
let sb = null, db = null, uid = null, myRole = '', myEmail = '', PROFILES = [];
let canWrite = false, isAdmin = false, loadFailed = false;
let stockMap = new Map(), partMap = new Map(), custMap = new Map(), suppMap = new Map(), poMap = new Map();
const names = {};
const F = { parts: { q: '', cat: '', st: '' }, in: { q: '', from: '', to: '', kind: '' }, out: { q: '', from: '', to: '', kind: '' },
  kartu: { part: '', from: '', to: '' }, cust: { q: '' }, supp: { q: '' }, po: { q: '', st: '' } };

const KIND_IN = [{ k: 'Penerimaan / Pembelian', p: 'supplier' }, { k: 'Retur dari Customer', p: 'customer' }, { k: 'Saldo Awal', p: null }, { k: 'Koreksi (+)', p: null }];
const KIND_OUT = [{ k: 'Penjualan / Pengeluaran', p: 'customer', po: true }, { k: 'Retur ke Supplier', p: 'supplier' }, { k: 'Pemakaian Internal', p: null }, { k: 'Koreksi (-)', p: null }];
const SALE = KIND_OUT[0].k;
const CATS = ['Filter', 'Engine', 'Hidrolik', 'Transmisi', 'Undercarriage', 'Kelistrikan', 'Ground Engaging Tools', 'Seal & Gasket', 'Pelumas', 'Lain-lain'];

function reindex() {
  stockMap = new Map();
  for (const m of S.movements) stockMap.set(m.partId, (stockMap.get(m.partId) || 0) + (m.dir === 'in' ? m.qty : -m.qty));
  partMap = new Map(S.parts.map(p => [p.id, p]));
  custMap = new Map(S.customers.map(p => [p.id, p]));
  suppMap = new Map(S.suppliers.map(p => [p.id, p]));
  poMap = new Map(S.pos.map(p => [p.id, p]));
  const dl2 = $('#plist'); dl2.innerHTML = S.parts.slice().sort((a, b) => byText(a.partNo, b.partNo)).map(p => `<option value="${esc(partLabel(p))}"></option>`).join('');
  const cats = [...new Set([...CATS, ...S.parts.map(p => p.category).filter(Boolean)])];
  $('#catlist').innerHTML = cats.map(c => `<option value="${esc(c)}"></option>`).join('');
}
const stock = id => stockMap.get(id) || 0;
const partLabel = p => `${p.partNo} — ${p.name}`;
function partFromText(t) {
  t = (t || '').trim(); if (!t) return null;
  const u = t.toUpperCase();
  return S.parts.find(p => partLabel(p) === t) || S.parts.find(p => p.partNo.toUpperCase() === u) || null;
}
function partStatus(p) {
  const s = stock(p.id);
  if (s <= 0) return { k: 'Habis', c: 'bad' };
  if (p.minStock > 0 && s <= p.minStock) return { k: 'Menipis', c: 'warn' };
  return { k: 'Aman', c: 'ok' };
}
function partyName(m) {
  if (m.partyType === 'customer') return custMap.get(m.partyId)?.name || '';
  if (m.partyType === 'supplier') return suppMap.get(m.partyId)?.name || '';
  return '';
}
function poDelivered(po) {
  const d = new Map();
  for (const m of S.movements) if (m.poId === po.id && m.dir === 'out' && m.kind === SALE) d.set(m.partId, (d.get(m.partId) || 0) + m.qty);
  return d;
}
function poInfo(po) {
  const d = poDelivered(po);
  let ord = 0, del = 0, val = 0, done = true;
  for (const it of po.items || []) { ord += it.qty; const x = Math.min(d.get(it.partId) || 0, it.qty); del += x; val += it.qty * (it.price || 0); if ((d.get(it.partId) || 0) < it.qty) done = false; }
  let st = { k: 'Terbuka', c: 'info' };
  if (po.status === 'batal') st = { k: 'Dibatalkan', c: 'gray' };
  else if (done && ord > 0) st = { k: 'Selesai', c: 'ok' };
  else if (del > 0) st = { k: 'Sebagian', c: 'warn' };
  return { d, ord, del, val, st, open: st.k === 'Terbuka' || st.k === 'Sebagian' };
}

/* ============ csv / pdf ============ */
function toCSV(rows) {
  return '﻿sep=;\r\n' + rows.map(r => r.map(v => { v = v == null ? '' : String(v); return /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';')).join('\r\n');
}
async function saveFile(filename, data) {
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: /\.csv$/.test(filename) ? 'text/csv;charset=utf-8' : 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000); toast('File diunduh: ' + filename);
  } catch (e) { toast('Gagal mengunduh file', 'err'); }
}
function exportCSV(name, rows) { saveFile(`${name}-${today()}.csv`, toCSV(rows)); }
function pdfDoc(title, subtitle) {
  const J = window.jspdf && window.jspdf.jsPDF;
  if (!J) { toast('Pustaka PDF belum termuat, coba lagi sebentar', 'err'); return null; }
  const doc = new J({ unit: 'mm', format: 'a4' });
  doc.setFont('helvetica', 'bold').setFontSize(13).text('PT INDONESIA PRIMA EQUIPMENT', 14, 14);
  doc.setFont('helvetica', 'normal').setFontSize(9).setTextColor(90).text('Cabang Sampit - Mitra Alat Berat JCB', 14, 19);
  doc.setDrawColor(245, 180, 0).setLineWidth(0.8).line(14, 22, 196, 22);
  doc.setTextColor(0).setFont('helvetica', 'bold').setFontSize(12).text(title, 14, 30);
  if (subtitle) doc.setFont('helvetica', 'normal').setFontSize(9).setTextColor(90).text(subtitle, 14, 35);
  doc.setTextColor(0);
  return doc;
}
function pdfTable(doc, startY, head, body, opts = {}) {
  doc.autoTable({ startY, head: [head], body, styles: { fontSize: 8.5, cellPadding: 1.8 }, headStyles: { fillColor: [22, 24, 29], textColor: 255 }, margin: { left: 14, right: 14 }, ...opts });
  return doc.lastAutoTable.finalY;
}
const pdfSafe = s => String(s ?? '').replace(/[—–]/g, '-').replace(/[^\x20-\x7e -ÿ]/g, '');

/* ============ modal ============ */
function modal(html, { wide, onClose } = {}) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(ov);
  const close = () => { ov.remove(); document.removeEventListener('keydown', esc_); onClose && onClose(); };
  const esc_ = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', esc_);
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
  return { el: ov.firstElementChild, close };
}
function confirmBox(msg, ok = 'Ya, lanjutkan', danger = true) {
  return new Promise(res => {
    let done = false;
    const m = modal(`<h3>Konfirmasi</h3><p>${esc(msg)}</p><div class="actions"><button class="btn" data-x="0">Batal</button><button class="btn ${danger ? 'danger' : 'primary'}" data-x="1">${esc(ok)}</button></div>`, { onClose: () => { if (!done) { done = true; res(false); } } });
    m.el.addEventListener('click', e => { const b = e.target.closest('[data-x]'); if (b && !done) { done = true; m.close(); res(b.dataset.x === '1'); } });
  });
}
function fld(label, name, o = {}) {
  const { type = 'text', val = '', opts = null, attrs = '', span = 1, list = null, ph = '' } = o;
  let inp;
  if (opts) inp = `<select name="${name}" ${attrs}>${opts.map(x => `<option value="${esc(x[0])}" ${String(x[0]) === String(val) ? 'selected' : ''}>${esc(x[1])}</option>`).join('')}</select>`;
  else if (type === 'textarea') inp = `<textarea name="${name}" rows="2" ${attrs}>${esc(val)}</textarea>`;
  else inp = `<input name="${name}" type="${type}" value="${esc(val)}" ${list ? `list="${list}"` : ''} placeholder="${esc(ph)}" ${attrs}>`;
  return `<label class="f s${span}"><span>${label}</span>${inp}</label>`;
}
const denied = () => toast('Akun Anda hanya bisa melihat data (tidak bisa mengubah).', 'err');
async function guarded(fn) {
  try { await fn(); return true; }
  catch (e) { console.error(e); toast('Gagal menyimpan: ' + ((e && (e.message || e.code)) || 'kesalahan tak dikenal'), 'err'); return false; }
}
const nowISO = () => new Date().toISOString();

/* ============ router ============ */
const ROUTES = [
  ['dashboard', 'Dashboard', viewDashboard],
  ['spare-part', 'Database Spare Part', viewParts],
  ['barang-masuk', 'Barang Masuk', () => viewMoves('in')],
  ['barang-keluar', 'Barang Keluar', () => viewMoves('out')],
  ['kartu-stok', 'Kartu Stok', viewKartu],
  ['purchase-order', 'Purchase Order', viewPO],
  ['customer', 'Database Customer', viewCustomers],
  ['supplier', 'Database Supplier', viewSuppliers],
  ['pengguna', 'Pengguna & Hak Akses', viewUsers, true],
];
let current = null;
function buildNav() {
  $('#nav').innerHTML = ROUTES.filter(r => !r[3] || isAdmin).map(([h, t]) => `<a href="#${h}" data-h="${h}"><i></i>${t}</a>`).join('');
}
function route() {
  const h = (location.hash || '#dashboard').slice(1);
  const r = ROUTES.find(x => x[0] === h && (!x[3] || isAdmin)) || ROUTES[0];
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.h === r[0]));
  $('#title').textContent = r[1];
  document.title = r[1] + ' — WMS PT Indonesia Prima Equipment Sampit';
  const main = $('#main');
  current = r[2]();
  main.innerHTML = current.shell;
  main.onclick = e => { const b = e.target.closest('[data-act]'); if (b && current.act) current.act(b.dataset.act, b.dataset.id, b); };
  main.oninput = main.onchange = e => { if (current.input) current.input(e); };
  if (current.bind) current.bind();
  refresh();
}
function refresh() {
  if (!current) return;
  const note = $('#loadnote');
  if (note) note.hidden = !loadFailed;
  current.fill();
}
const ro = () => !canWrite ? '<div class="banner info">Akun Anda berhak <b>melihat saja</b>. Untuk menambah atau mengubah data, minta admin mengubah peran Anda menjadi Staf Gudang di menu Pengguna & Hak Akses.</div>' : '';
const loadNoteHTML = '<div id="loadnote" class="banner warn" hidden>Data belum bisa dijangkau. Periksa koneksi internet; data yang tampil mungkin belum yang terbaru.</div>';
const empty = (t) => `<div class="empty">${t}</div>`;

/* ============ DASHBOARD ============ */
function viewDashboard() {
  return {
    shell: `${ro()}${loadNoteHTML}<div id="dash"></div>`,
    act(a) {
      if (a === 'sample') loadSample();

/* CSV import */
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const lines0 = text.split(/\r?\n/);
  if (/^sep=/i.test(lines0[0])) lines0.shift();
  text = lines0.join('\n');
  const first = text.split('\n')[0] || '';
  const delim = [';', '\t', ','].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
const numID = s => { s = String(s ?? '').trim().replace(/[Rp\s]/gi, ''); if (!s) return 0; if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/[.,](?=\d{3}(\D|$))/g, ''); return parseFloat(s) || 0; };
function importParts() {
  if (!canWrite) return denied();
  const m = modal(`<h3>Impor Spare Part dari CSV</h3>
  <p class="mut" style="margin-top:0">Kolom yang dikenali: <b>No. Part</b>, <b>Nama</b>, Kategori, Model, Satuan, Lokasi, Stok Minimum, Harga, Stok Awal. Baris dengan no. part yang sudah ada akan dilewati. Excel: simpan sebagai CSV.</p>
  <p><button class="btn sm" data-x="tpl">Unduh template CSV</button></p>
  <input type="file" id="fi" accept=".csv,.txt,text/csv">
  <div id="prev" style="margin-top:12px"></div>
  <div class="actions"><button class="btn" data-x="c">Tutup</button><button class="btn primary" data-x="go" disabled>Impor</button></div>`);
  let items = [];
  m.el.addEventListener('click', async e => {
    const b = e.target.closest('[data-x]'); if (!b) return;
    if (b.dataset.x === 'c') m.close();
    if (b.dataset.x === 'tpl') saveFile('template-spare-part.csv', toCSV([['No. Part', 'Nama', 'Kategori', 'Model', 'Satuan', 'Lokasi', 'Stok Minimum', 'Harga', 'Stok Awal'], ['CONTOH-001', 'Filter Oli Mesin', 'Filter', '3CX', 'pcs', 'A-01-1', 10, 185000, 24]]));
    if (b.dataset.x === 'go') {
      b.disabled = true; let n = 0;
      for (const it of items) {
        const ok = await guarded(async () => {
          const r = await db.collection('parts').add({ ...it.data, createdAt: nowISO(), createdBy: uid });
          if (it.open > 0) await db.collection('movements').add({ docNo: 'SA-' + it.data.partNo, date: today(), partId: r.id, qty: it.open, dir: 'in', kind: 'Saldo Awal', partyType: '', partyId: '', poId: '', note: 'Stok awal (impor)', by: uid, at: nowISO() });
        });
        if (!ok) break; n++; $('#prev', m.el).textContent = `Mengimpor… ${n}/${items.length}`;
      }
      toast(`${n} spare part diimpor`); m.close();
    }
  });
  $('#fi', m.el).addEventListener('change', async ev => {
    const file = ev.target.files[0]; if (!file) return;
    const rows = parseCSV(await file.text());
    if (rows.length < 2) { $('#prev', m.el).textContent = 'File kosong atau tidak terbaca.'; return; }
    const norm = h => h.toLowerCase().replace(/[^a-z]/g, '');
    const alias = { partNo: ['nopart', 'partno', 'partnumber', 'kode', 'kodepart', 'nomorpart'], name: ['nama', 'name', 'namabarang', 'deskripsi', 'description'], category: ['kategori', 'category'], model: ['model', 'modelaplikasi', 'aplikasi'], unit: ['satuan', 'unit', 'uom'], location: ['lokasi', 'lokasirak', 'rak', 'bin', 'location'], minStock: ['stokminimum', 'min', 'minstock', 'stokmin', 'minimum'], price: ['harga', 'hargarp', 'hargajual', 'price'], open: ['stokawal', 'saldoawal', 'stok', 'qty', 'opening'] };
    const hdr = rows[0].map(norm); const idx = {};
    for (const k in alias) idx[k] = hdr.findIndex(h => alias[k].includes(h));
    if (idx.partNo < 0 || idx.name < 0) { $('#prev', m.el).innerHTML = '<span class="out">Kolom “No. Part” dan “Nama” wajib ada di baris pertama.</span>'; return; }
    const seen = new Set(S.parts.map(p => p.partNo.toUpperCase())); let dup = 0, bad = 0; items = [];
    for (const r of rows.slice(1)) {
      const g = k => idx[k] >= 0 ? (r[idx[k]] || '').trim() : '';
      const partNo = g('partNo').toUpperCase(), name = g('name');
      if (!partNo || !name) { bad++; continue; }
      if (seen.has(partNo)) { dup++; continue; } seen.add(partNo);
      items.push({ open: numID(g('open')), data: { partNo, name, category: g('category'), model: g('model'), unit: g('unit') || 'pcs', location: g('location'), supplierId: '', minStock: numID(g('minStock')), price: numID(g('price')) } });
    }
    $('#prev', m.el).innerHTML = `<b>${items.length}</b> baris siap diimpor · ${dup} dilewati (no. part sudah ada/duplikat) · ${bad} baris tidak lengkap`;

function openTx(dir, preset = {}) {

  function setParty() {

    f.elements.poId.innerHTML = '<option value="">— tanpa PO —</option>' + list.map(po => `<option value="${po.id}">${esc(po.poNo)} · ${esc(custMap.get(po.customerId)?.name || '')}</option>`).join('');

      });
      if (ok) { m.close(); toast(`${lines.length} baris tersimpan`); } else b.disabled = false;
    }
  });
}

/* ============ KARTU STOK ============ */
function ledgerFor(partId) {

  let bal = 0; return rows.map(m => { const i = m.dir === 'in' ? m.qty : 0, o = m.dir === 'out' ? m.qty : 0; bal += i - o; return { ...m, i, o, bal }; });
}

    const before = from ? all.filter(r => r.date < from) : [];
    const open = before.length ? before[before.length - 1].bal : 0;
    const rows = all.filter(r => (!from || r.date >= from) && (!to || r.date <= to));
    return { p, open, rows, tin: rows.reduce((s, r) => s + r.i, 0), tout: rows.reduce((s, r) => s + r.o, 0) };

    },
    act(a) {
      if (!cur) { toast('Pilih spare part terlebih dahulu.', 'err'); return; }

        doc.setFontSize(9.5).setFont('helvetica', 'normal');

async function delParty(kind, id) {
  if (!isAdmin) return denied();
  const isC = kind === 'customer', coll = isC ? 'customers' : 'suppliers', x = (isC ? custMap : suppMap).get(id); if (!x) return;
  const used = S.movements.some(m => m.partyId === id) || (isC ? S.pos.some(p => p.customerId === id) : S.parts.some(p => p.supplierId === id));
  if (used) { toast('Data ini sudah dipakai di transaksi / PO / spare part, jadi tidak bisa dihapus.', 'err'); return; }
  if (await confirmBox(`Hapus ${x.name}?`)) { if (await guarded(() => db.doc(`${coll}/${id}`).delete())) toast('Dihapus'); }
}

/* ============ PURCHASE ORDER (customer) ============ */
function viewPO() {
  let rows = [];
  return {
    shell: `${ro()}${loadNoteHTML}
    <div class="bar"><input type="search" id="q" placeholder="Cari no. PO, customer…" value="${esc(F.po.q)}">
      <select id="st"><option value="">Semua status</option>${['Terbuka', 'Sebagian', 'Selesai', 'Dibatalkan'].map(s => `<option ${F.po.st === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
      <span class="grow"></span><button class="btn" data-act="csv">Export CSV</button>${canWrite ? '<button class="btn primary" data-act="add">+ PO Customer</button>' : ''}</div>
    <div class="tw"><div id="tbl"></div></div>`,
    input(e) { if (e.target.id === 'q') F.po.q = e.target.value; if (e.target.id === 'st') F.po.st = e.target.value; this.fill(); },
    act(a, id) {
      if (a === 'add') poForm();
      if (a === 'view') poDetail(id);
      if (a === 'csv') exportCSV('purchase-order', [['No. PO', 'Tanggal', 'Customer', 'Dibutuhkan', 'Jumlah Item', 'Qty Dipesan', 'Qty Terkirim', 'Nilai (Rp)', 'Status'], ...rows.map(p => { const i = poInfo(p); return [p.poNo, fmtD(p.date), custMap.get(p.customerId)?.name, fmtD(p.needBy), (p.items || []).length, i.ord, i.del, i.val, i.st.k]; })]);
    },
    fill() {
      const q = F.po.q.toLowerCase();
      rows = S.pos.filter(p => (!q || (p.poNo + ' ' + (custMap.get(p.customerId)?.name || '')).toLowerCase().includes(q)) && (!F.po.st || poInfo(p).st.k === F.po.st)).sort((a, b) => (b.date + b.poNo).localeCompare(a.date + a.poNo));
      $('#tbl').innerHTML = rows.length ? `<table><thead><tr><th>No. PO</th><th>Tanggal</th><th>Customer</th><th>Dibutuhkan</th><th class="n">Item</th><th>Progres kirim</th><th class="n">Nilai</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(p => { const i = poInfo(p); const pct = i.ord ? Math.round(i.del / i.ord * 100) : 0; return `<tr><td class="mono"><b>${esc(p.poNo)}</b></td><td>${fmtD(p.date)}</td><td>${esc(custMap.get(p.customerId)?.name || '—')}</td><td>${fmtD(p.needBy)}</td><td class="n">${(p.items || []).length}</td><td><div class="prog"><i style="width:${pct}%"></i></div><small class="mut">${fmtN(i.del)}/${fmtN(i.ord)} unit</small></td><td class="n">${fmtRp(i.val)}</td><td><span class="chip ${i.st.c}">${i.st.k}</span></td><td class="act"><button class="btn sm" data-act="view" data-id="${p.id}">Detail</button></td></tr>`; }).join('')}</tbody></table>` : empty(S.pos.length ? 'Tidak ada PO yang cocok.' : (loaded.pos ? 'Belum ada PO customer. Klik “+ PO Customer”.' : 'Memuat…'));
    }
  };
}
function poForm(id) {
  if (!canWrite) return denied();
  if (!S.customers.length) { toast('Tambahkan customer terlebih dahulu di menu Database Customer.', 'err'); return; }
  if (!S.parts.length) { toast('Tambahkan spare part terlebih dahulu.', 'err'); return; }
  const po = id ? poMap.get(id) : {};
  const m = modal(`<h3>${id ? 'Edit' : 'Tambah'} PO Customer</h3><form id="pf"><div class="grid">
    ${fld('No. PO *', 'poNo', { val: po.poNo || '', attrs: 'required', ph: 'No. PO dari customer' })}
    ${fld('Customer *', 'customerId', { val: po.customerId || '', opts: [['', '— pilih customer —'], ...S.customers.slice().sort((a, b) => byText(a.name, b.name)).map(c => [c.id, c.name])], attrs: 'required' })}
    ${fld('Tanggal PO', 'date', { type: 'date', val: po.date || today(), attrs: 'required' })}
    ${fld('Dibutuhkan paling lambat', 'needBy', { type: 'date', val: po.needBy || '' })}
    ${fld('Catatan', 'note', { type: 'textarea', span: 2, val: po.note || '' })}
  </div>
  <div class="lines po"><div class="lh"><span>Spare part</span><span>Qty</span><span>Harga satuan</span><span>Subtotal</span><span></span></div><div id="ls"></div>
  <div style="padding:8px 10px;border-top:1px solid #f0f1f3;display:flex;justify-content:space-between;align-items:center"><button type="button" class="btn sm" data-x="addl">+ Tambah baris</button><b id="tot"></b></div></div></form>
  <div class="err" id="perr"></div><div class="actions"><button class="btn" data-x="c">Batal</button><button class="btn primary" data-x="s">Simpan PO</button></div>`, { wide: true });
  const el = m.el, ls = $('#ls', el);
  function total() { let t = 0; for (const r of ls.children) { const q = parseFloat($('.lq', r).value) || 0, pr = parseFloat($('.lr2', r).value) || 0; $('.ls', r).textContent = fmtRp(q * pr); t += q * pr; } $('#tot', el).textContent = 'Total: ' + fmtRp(t); }
  function addLine(it = {}) {
    const p = it.partId ? partMap.get(it.partId) : null;
    const d = document.createElement('div'); d.className = 'lr';
    d.innerHTML = `<input class="lp" list="plist" placeholder="Ketik no. part / nama…" value="${esc(p ? partLabel(p) : '')}"><input class="lq" type="number" min="0" step="any" value="${it.qty || ''}" placeholder="0"><input class="lr2" type="number" min="0" step="any" value="${it.price ?? ''}" placeholder="0"><span class="ls mut"></span><button type="button" class="btn sm" data-x="rm">×</button>`;
    ls.appendChild(d); total();
  }
  ls.addEventListener('input', e => {
    if (e.target.classList.contains('lp')) { const p = partFromText(e.target.value); const r = e.target.parentElement; if (p && !$('.lr2', r).value) $('.lr2', r).value = p.price || ''; }
    total();
  });
  (po.items && po.items.length ? po.items : [{}]).forEach(addLine);
  el.addEventListener('click', async e => {
    const b = e.target.closest('[data-x]'); if (!b) return;
    const x = b.dataset.x;
    if (x === 'c') m.close();
    if (x === 'addl') addLine();
    if (x === 'rm') { b.closest('.lr').remove(); if (!ls.children.length) addLine(); total(); }
    if (x === 's') {
      const f = $('#pf', el), err = $('#perr', el); err.textContent = '';
      if (!f.reportValidity()) return;
      const v = Object.fromEntries(new FormData(f));
      const items = [];
      for (const r of ls.children) {
        const raw = $('.lp', r).value.trim(), q = parseFloat($('.lq', r).value), pr = parseFloat($('.lr2', r).value) || 0;
        if (!raw && !q) continue;
        const p = partFromText(raw);
        if (!p) { err.textContent = `Spare part “${raw}” tidak ditemukan. Pilih dari daftar.`; return; }
        if (!(q > 0)) { err.textContent = `Qty untuk ${p.partNo} harus lebih dari 0.`; return; }
        const ex = items.find(i => i.partId === p.id); if (ex) { ex.qty += q; } else items.push({ partId: p.id, qty: q, price: pr });
      }
      if (!items.length) { err.textContent = 'Isi minimal satu baris spare part.'; return; }
      if (S.pos.some(x2 => x2.id !== id && x2.customerId === v.customerId && x2.poNo.toLowerCase() === v.poNo.trim().toLowerCase())) { err.textContent = 'No. PO ini sudah ada untuk customer yang sama.'; return; }
      b.disabled = true;
      const data = { poNo: v.poNo.trim(), customerId: v.customerId, date: v.date, needBy: v.needBy || '', note: (v.note || '').trim(), items, updatedAt: nowISO() };
      const ok = await guarded(async () => { if (id) await db.doc('pos/' + id).update(data); else await db.collection('pos').add({ ...data, status: 'aktif', createdAt: nowISO(), createdBy: uid }); });
      if (ok) { m.close(); toast('PO tersimpan'); } else b.disabled = false;
    }
  });
}
function poDetail(id) {
  const po = poMap.get(id); if (!po) return;
  const inf = poInfo(po), c = custMap.get(po.customerId);
  const dels = S.movements.filter(x => x.poId === id && x.dir === 'out').sort((a, b) => a.date.localeCompare(b.date));
  const m = modal(`<h3>PO ${esc(po.poNo)} <span class="chip ${inf.st.c}">${inf.st.k}</span></h3>
  <dl class="kv"><dt>Customer</dt><dd>${esc(c?.name || '—')}</dd><dt>Tanggal PO</dt><dd>${fmtD(po.date)}</dd><dt>Dibutuhkan</dt><dd>${fmtD(po.needBy) || '—'}</dd><dt>Catatan</dt><dd>${esc(po.note) || '—'}</dd><dt>Nilai PO</dt><dd>${fmtRp(inf.val)}</dd></dl>
  <div class="tw"><table><thead><tr><th>Spare part</th><th class="n">Dipesan</th><th class="n">Terkirim</th><th class="n">Sisa</th><th class="n">Stok</th><th class="n">Harga</th></tr></thead><tbody>${po.items.map(it => { const p = partMap.get(it.partId), d = inf.d.get(it.partId) || 0; return `<tr><td>${p ? `<span class="mono">${esc(p.partNo)}</span> ${esc(p.name)}` : '(dihapus)'}</td><td class="n">${fmtN(it.qty)}</td><td class="n">${fmtN(d)}</td><td class="n"><b>${fmtN(Math.max(0, it.qty - d))}</b></td><td class="n ${stock(it.partId) < Math.max(0, it.qty - d) ? 'out' : ''}">${fmtN(stock(it.partId))}</td><td class="n">${fmtRp(it.price)}</td></tr>`; }).join('')}</tbody></table></div>
  ${dels.length ? `<h2 style="margin-top:16px">Riwayat pengiriman</h2><div class="tw"><table><tbody>${dels.map(x => `<tr><td>${fmtD(x.date)}</td><td class="mono">${esc(x.docNo)}</td><td>${esc(partMap.get(x.partId)?.partNo || '')}</td><td class="n">${fmtN(x.qty)}</td></tr>`).join('')}</tbody></table></div>` : ''}
  <div class="actions" style="flex-wrap:wrap"><button class="btn" data-x="pdf">Unduh PDF</button>
  ${canWrite && inf.open ? '<button class="btn primary" data-x="send">Buat Barang Keluar</button>' : ''}${canWrite ? '<button class="btn" data-x="edit">Edit</button>' : ''}
  ${canWrite && po.status !== 'batal' && inf.st.k !== 'Selesai' ? '<button class="btn" data-x="cancel">Batalkan PO</button>' : ''}${canWrite && po.status === 'batal' ? '<button class="btn" data-x="reopen">Aktifkan lagi</button>' : ''}
  ${isAdmin ? '<button class="btn danger" data-x="del">Hapus</button>' : ''}<button class="btn" data-x="c">Tutup</button></div>`, { wide: true });
  m.el.addEventListener('click', async e => {
    const b = e.target.closest('[data-x]'); if (!b) return; const x = b.dataset.x;
    if (x === 'c') m.close();
    if (x === 'edit') { m.close(); poForm(id); }
    if (x === 'send') { m.close(); location.hash = '#barang-keluar'; setTimeout(() => openTx('out', { kind: SALE, partyId: po.customerId, poId: id, note: 'Pengiriman PO ' + po.poNo, lines: [] }), 50); setTimeout(() => { const f = $('#tx'); if (f && f.elements.poId) { f.elements.poId.value = id; f.elements.poId.dispatchEvent(new Event('change')); } }, 120); }
    if (x === 'cancel' || x === 'reopen') { if (await guarded(() => db.doc('pos/' + id).update({ status: x === 'cancel' ? 'batal' : 'aktif' }))) { m.close(); toast(x === 'cancel' ? 'PO dibatalkan' : 'PO diaktifkan'); } }
    if (x === 'del') { if (dels.length) { toast('PO ini sudah punya pengiriman, jadi tidak bisa dihapus. Gunakan “Batalkan PO”.', 'err'); return; } if (await confirmBox('Hapus PO ' + po.poNo + '?')) { if (await guarded(() => db.doc('pos/' + id).delete())) { m.close(); toast('PO dihapus'); } } }
    if (x === 'pdf') {
      const doc = pdfDoc('PURCHASE ORDER CUSTOMER', 'No. PO: ' + pdfSafe(po.poNo)); if (!doc) return;
      doc.setFontSize(9.5).setFont('helvetica', 'normal');
      doc.text('Customer   : ' + pdfSafe(c?.name || '-'), 14, 42); doc.text('Tanggal PO : ' + fmtD(po.date), 14, 47); doc.text('Dibutuhkan : ' + (fmtD(po.needBy) || '-'), 14, 52);
      doc.text('Status       : ' + inf.st.k, 130, 42); if (po.note) doc.text('Catatan: ' + pdfSafe(po.note).slice(0, 70), 14, 57);
      const body = po.items.map((it, i) => { const p = partMap.get(it.partId) || {}; const d = inf.d.get(it.partId) || 0; return [i + 1, pdfSafe(p.partNo), pdfSafe(p.name), fmtN(it.qty), fmtN(d), fmtN(Math.max(0, it.qty - d)), fmtN(it.price), fmtN(it.qty * it.price)]; });
      const y = pdfTable(doc, 62, ['No', 'No. Part', 'Nama', 'Qty', 'Terkirim', 'Sisa', 'Harga (Rp)', 'Subtotal (Rp)'], body, { columnStyles: { 3: { halign: 'right' }, 4: { halign: 'right' }, 5: { halign: 'right' }, 6: { halign: 'right' }, 7: { halign: 'right' } } });
      doc.setFont('helvetica', 'bold').text('Total: Rp ' + fmtN(inf.val), 196, y + 8, { align: 'right' });
      saveFile(`PO-${pdfSafe(po.poNo).replace(/[^\w-]+/g, '_')}.pdf`, doc.output('blob'));
    }
  });
}

/* ============ pengguna ============ */
const ROLES = [['admin', 'Admin'], ['staff', 'Staf Gudang'], ['viewer', 'Viewer (lihat saja)'], ['pending', 'Menunggu persetujuan']];
async function loadProfiles() {
  const { data, error } = await sb.from('profiles').select('id,email,full_name,role').order('email');
  if (error) { console.error(error); return; }
  PROFILES = data || [];
  for (const p of PROFILES) names[p.id] = p.full_name || p.email || '';
}
function viewUsers() {
  return {
    shell: `<div class="banner info">Akun baru dibuat di dashboard Supabase (Authentication → Users → Add user). Setelah akun itu pertama kali masuk, atur perannya di sini. Peran: <b>Admin</b> (semua + hapus data), <b>Staf Gudang</b> (input &amp; ubah data), <b>Viewer</b> (hanya lihat).</div><div class="tw"><div id="tbl"></div></div>`,
    async input(e) {
      const id = e.target.dataset.uid; if (!id) return;
      if (id === uid) { toast('Anda tidak bisa mengubah peran akun sendiri.', 'err'); this.fill(); return; }

      if (error) toast('Gagal mengubah peran: ' + error.message, 'err'); else toast('Peran diperbarui');
      await loadProfiles(); this.fill();
    },
    fill() {
      $('#tbl').innerHTML = PROFILES.length ? `<table><thead><tr><th>Email</th><th>Nama</th><th>Peran</th></tr></thead><tbody>${PROFILES.map(p => `<tr><td>${esc(p.email)}${p.id === uid ? ' <span class="chip gray">Anda</span>' : ''}</td><td>${esc(p.full_name || '')}</td><td><select data-uid="${p.id}" ${p.id === uid ? 'disabled' : ''}>${ROLES.map(r => `<option value="${r[0]}" ${p.role === r[0] ? 'selected' : ''}>${r[1]}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table>` : empty('Belum ada pengguna.');
    }
  };
}

/* ============ boot / supabase ============ */
function upsertLocal(k, r) {
  const o = { id: r.id, ...(r.data || {}) }; const i = S[k].findIndex(x => x.id === r.id);
  if (i >= 0) S[k][i] = o; else S[k].push(o);
}
function makeDb() {
  const chk = (error, rows, what) => { if (error) throw error; if (rows && !rows.length) throw new Error('Tidak punya izin untuk ' + what); };
  return {
    collection: k => ({
      async add(data) { const { data: r, error } = await sb.from(k).insert({ data }).select('id,data').single(); if (error) throw error; upsertLocal(k, r); schedule(); return { id: r.id }; }
    }),
    doc: path => {
      const [k, id] = path.split('/');
      return {
        async update(patch) {
          const cur = S[k].find(x => x.id === id) || {}; const { id: _i, ...rest } = cur; const nd = { ...rest, ...patch };
          const { data, error } = await sb.from(k).update({ data: nd, updated_at: nowISO() }).eq('id', id).select('id'); chk(error, data, 'mengubah data');
          upsertLocal(k, { id, data: nd }); schedule();
        },
        async delete() {
          const { data, error } = await sb.from(k).delete().eq('id', id).select('id'); chk(error, data, 'menghapus data');
          S[k] = S[k].filter(x => x.id !== id); schedule();
        }
      };
    }
  };
}
async function fetchAll(k) {
  const out = []; const step = 1000;
  for (let from = 0; ; from += step) {
    const { data, error } = await sb.from(k).select('id,data').order('created_at', { ascending: true }).order('id').range(from, from + step - 1);
    if (error) throw error; out.push(...data); if (data.length < step) break;
  }
  return out;
}
function showLogin(msg) {
  const L = $('#login'); L.hidden = false;
  L.innerHTML = `<form class="box" id="lf"><h2>WMS Gudang Spare Part</h2><p>PT Indonesia Prima Equipment · Cabang Sampit</p>
    ${fld('Email', 'email', { type: 'email', attrs: 'required autocomplete="username"' })}${fld('Password', 'password', { type: 'password', attrs: 'required autocomplete="current-password"' })}
    <div class="err" id="lerr">${esc(msg || '')}</div><button class="btn primary" type="submit">Masuk</button></form>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault(); const v = Object.fromEntries(new FormData(e.target)); const btn = $('button', e.target); btn.disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: v.email.trim(), password: v.password });
    if (error) {
      const m = String(error.message || '');
      let t = 'Gagal masuk: ' + m;
      if (/invalid login credentials/i.test(m)) t = 'Email atau password salah (atau akun belum dibuat di Supabase).';
      else if (/not confirmed/i.test(m)) t = 'Email belum dikonfirmasi. Di Supabase: Authentication > Users, buka akun ini lalu konfirmasi, atau buat ulang dengan "Auto Confirm User" dicentang.';
      else if (/api key|apikey|jwt/i.test(m)) t = 'Kunci API di config.js salah. Pakai anon/publishable key dari Project Settings > API.';
      else if (/failed to fetch|network|load failed/i.test(m)) t = 'Tidak bisa menghubungi Supabase. Periksa SUPABASE_URL di config.js dan koneksi internet.';
      $('#lerr').textContent = t; btn.disabled = false; return;
    }
    L.hidden = true; start(data.session);
  };
}
function showPending(email) {
  const L = $('#login'); L.hidden = false;
  L.innerHTML = `<div class="box"><h2>Menunggu persetujuan</h2><p>Akun <b>${esc(email)}</b> sudah terdaftar tetapi belum diberi peran. Minta admin gudang mengatur peran Anda, lalu muat ulang halaman ini.</p><button class="btn" id="lo">Keluar</button></div>`;
  $('#lo').onclick = async () => { await sb.auth.signOut(); location.reload(); };
}
let raf = 0;
function schedule() { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; reindex(); refresh(); }); }
async function start(session) {
  uid = session.user.id; myEmail = session.user.email;
  const { data: prof, error } = await sb.from('profiles').select('role,full_name').eq('id', uid).maybeSingle();
  if (error) { console.error(error); }
  myRole = prof ? prof.role : 'pending';
  if (!['admin', 'staff', 'viewer'].includes(myRole)) return showPending(myEmail);
  isAdmin = myRole === 'admin'; canWrite = isAdmin || myRole === 'staff';
  $('#role').textContent = { admin: 'Admin', staff: 'Staf gudang', viewer: 'Hanya lihat' }[myRole];
  $('#who').textContent = myEmail; const lo = $('#logout'); lo.hidden = false;
  lo.onclick = async () => { await sb.auth.signOut(); location.reload(); };
  db = makeDb(); buildNav();
  await loadProfiles();
  const t = setTimeout(() => { loadFailed = true; refresh(); }, 10000);
  try {
    await Promise.all(Object.keys(S).map(async k => { S[k] = (await fetchAll(k)).map(r => ({ id: r.id, ...r.data })); loaded[k] = true; }));
    clearTimeout(t); loadFailed = false;
  } catch (e) { console.error(e); loadFailed = true; }
  reindex(); route();
  const ch = sb.channel('wms-live');
  for (const k of Object.keys(S)) ch.on('postgres_changes', { event: '*', schema: 'public', table: k }, p => {
    if (p.eventType === 'DELETE') S[k] = S[k].filter(x => x.id !== p.old.id); else upsertLocal(k, p.new);
    schedule();
  });
  ch.subscribe();
}
async function boot() {
  window.addEventListener('hashchange', route);
  const cfg = window.WMS_CONFIG;
  if (!cfg || !cfg.SUPABASE_URL || /ISI_|YOUR_/i.test(cfg.SUPABASE_URL + cfg.SUPABASE_ANON_KEY) || !window.supabase) {
    $('#main').innerHTML = '<div class="card"><h2>Konfigurasi belum diisi</h2><p class="mut">Buka file <b>config.js</b> lalu isi <b>SUPABASE_URL</b> dan <b>SUPABASE_ANON_KEY</b> sesuai panduan.</p></div>'; $('#role').textContent = 'Belum dikonfigurasi'; return;
  }
  sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  const { data: { session } } = await sb.auth.getSession();
  if (session) start(session); else { $('#role').textContent = 'Belum masuk'; showLogin(); }
}
boot();
