<style>
:root{--ink:#16181d;--ink2:#2a2d35;--mut:#6b7280;--line:#e5e7eb;--bg:#f4f5f7;--card:#fff;--y:#f5b400;--y2:#ffd45c;--ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;--info:#1d4ed8;--infobg:#dbeafe;--r:10px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:Inter,system-ui,sans-serif;font-size:14px;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100vh}
#side{width:232px;background:var(--ink);color:#d1d5db;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:16px 16px 14px;border-bottom:1px solid #2b2e36;display:flex;align-items:center;gap:11px}.brand img{width:44px;height:44px;flex:none;display:block}.brand>div{min-width:0}
.brand b{display:block;color:#fff;font-size:13px;letter-spacing:.3px;line-height:1.25}
.brand span{display:inline-block;margin-top:6px;background:var(--y);color:var(--ink);font-weight:700;font-size:10.5px;padding:2px 7px;border-radius:4px;letter-spacing:.5px}
nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
nav a{color:#c3c7cf;text-decoration:none;padding:9px 12px;border-radius:7px;font-weight:500;display:flex;align-items:center;gap:10px}
nav a i{width:8px;height:8px;border-radius:2px;background:#4b5160;flex-shrink:0}
nav a:hover{background:#22252c;color:#fff}
nav a.on{background:var(--y);color:var(--ink);font-weight:600}
nav a.on i{background:var(--ink)}
nav .sep{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#6b7280;padding:12px 12px 4px}
#content{flex:1;min-width:0}
#top{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;gap:12px}
#top h1{font-size:18px;margin:0;font-weight:700}
.role{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--infobg);color:var(--info);white-space:nowrap}
#main{padding:22px 24px 60px;max-width:1320px}
.banner{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.banner.info{background:var(--infobg);color:var(--info)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat small{color:var(--mut);font-weight:500;display:block;margin-bottom:6px}
.stat b{font-size:24px;letter-spacing:-.5px}
.stat.hl{border-left:4px solid var(--y)}

.cards.kpi{grid-template-columns:repeat(5,minmax(0,1fr));align-items:stretch}
.kpic{display:flex;flex-direction:column;min-height:112px;padding:16px 18px}
.kpic small{font-size:11.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.kpic b{font-size:24px;line-height:1.15;white-space:nowrap}
.kpic .ks{margin-top:auto;padding-top:8px;font-size:12px;color:var(--mut);line-height:1.35}.kpic .ks b{font-size:inherit;color:var(--ink);white-space:normal}
.kpic.bad{border-left:4px solid #ef4444}.kpic.info{border-left:4px solid #3b82f6}.kpic.ok{border-left:4px solid #16a34a}.kpic.warn{border-left:4px solid #f59e0b}
.kpic b .in,.kpic b .out{font-weight:700}.kpic b .mut2{color:#b6bcc7;font-weight:400}
@media(max-width:1300px){.cards.kpi{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:860px){.cards.kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.kpic b{font-size:21px}}
@media(max-width:560px){.cards.kpi{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpic{padding:12px 13px;min-height:100px}.kpic b{font-size:19px}.kpic small{font-size:10.5px;letter-spacing:.3px}.kpic .ks{font-size:11px}.cards.kpi .revcard{grid-column:span 2}}
.chrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.chrow .card,.chfull{margin:0}.chfull{margin-bottom:18px}
.chcard{min-width:0;max-width:100%;overflow:hidden}.chcard h2{margin:0 0 2px;font-size:15px}.chcard .sub{color:var(--mut);font-size:12px;margin-bottom:10px}
.dn{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.dn svg{width:210px;height:210px;flex:none}
.dn .lg{display:flex;flex-direction:column;gap:6px;font-size:12.5px;min-width:150px}
.lgi{display:flex;align-items:center;gap:7px;white-space:nowrap}.lgi i{width:11px;height:11px;border-radius:3px;flex:none}.lgi b{margin-left:auto;padding-left:10px;font-weight:600}
.lgh{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:12.5px;margin-bottom:6px}
.lgh span{display:flex;align-items:center;gap:6px}.lgh i{width:18px;height:3px;border-radius:2px}
.lc{width:100%;height:auto;display:block}
@media(max-width:900px){.chrow{grid-template-columns:1fr}}
.revcard{grid-column:span 2;background:#1f2229;color:#fff;border-left:4px solid var(--y);display:flex;align-items:center;justify-content:space-between;gap:16px;min-width:0}
.revcard small{display:block;color:#9aa0ac;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase}
.revcard .rv{font-size:26px;font-weight:700;letter-spacing:-.5px;margin:4px 0 12px;white-space:nowrap}
.revcard .tg{color:#aeb3bd;font-size:15px;font-weight:600;margin-top:3px;white-space:nowrap}
.revcard .tgb{background:none;border:0;color:var(--y);cursor:pointer;font-size:12px;padding:0 0 0 6px;text-decoration:underline}

<script>
/* ============ util ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = n => new Intl.NumberFormat('id-ID').format(n || 0);
const fmtRp = n => 'Rp ' + fmtN(Math.round(n || 0));
const cmp = n => { n = n || 0; const a = Math.abs(n), sg = n < 0 ? '-' : ''; const f = (v, u) => sg + (Math.round(v * 100) / 100).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' ' + u; return a >= 1e12 ? f(a / 1e12, 'T') : a >= 1e9 ? f(a / 1e9, 'M') : a >= 1e6 ? f(a / 1e6, 'jt') : a >= 1e3 ? f(a / 1e3, 'rb') : sg + Math.round(a); };
const fmtRpC = n => 'Rp ' + cmp(n);
const rpC = n => `<span title="${fmtRp(n)}">${fmtRpC(n)}</span>`;
const fmtD = iso => { if (!iso) return ''; const [y, m, d] = iso.slice(0, 10).split('-'); return `${d}/${m}/${y}`; };
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const byText = (a, b) => String(a || '').localeCompare(String(b || ''), 'id');
function toast(msg, type) {
  const w = $('#toast'), d = document.createElement('div');
  d.textContent = msg; if (type === 'err') d.className = 'err'; w.appendChild(d);
  setTimeout(() => d.remove(), type === 'err' ? 6000 : 2800);
}

/* ============ state ============ */
const S = { parts: [], movements: [], customers: [], suppliers: [], pos: [], sorders: [], settings: [] };
let minMap = new Map(), closedSet = new Set(), setMissing = false, soMissing = false, tblErr = {}, dataVer = 0, dm = new Map(), incoming = new Map(), soReq = new Map();
const loaded = {};
let sb = null, db = null, uid = null, myRole = '', myEmail = '', PROFILES = [];
let canWrite = false, canPO = false, canCust = false, isFull = false, loadFailed = false;
let stockMap = new Map(), partMap = new Map(), custMap = new Map(), suppMap = new Map(), poMap = new Map(), commit = new Map(), delivIdx = new Map(), reqIdx = new Map();
const names = {};
const F = { dash: { year: new Date().getFullYear() }, so: { q: '', per: '', st: '', sel: new Set() }, cek: { text: '' }, rep: { ym: new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 7), q: '', mv: '', urg: '', active: true }, all: { q: '', from: '', to: '', kind: '', dir: '' }, soh: { ym: new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 7), q: '', active: true, moved: false }, parts: { q: '', cat: '', st: '', hide: false, inc: '' }, in: { q: '', from: '', to: '', kind: '' }, out: { q: '', from: '', to: '', kind: '' },
  kartu: { part: '', from: '', to: '' }, cust: { q: '', grp: '' }, supp: { q: '' }, po: { q: '', st: '', sort: '' } };

const IN_TYPES = ['IN', 'RETURN CUSTOMER', 'SALDO AWAL', 'KOREKSI (+)'];
const OUT_TYPES = ['SOLD CUSTOMER', 'WH03 SERVICE', 'BUNDLING', 'IPE BJM', 'IPE SMD', 'IPE BPP', 'IPE PTK', 'IPE SBY', 'IPE JKT', 'IPE PKY', 'PART DAMAGE', 'PART RETURN', 'FUCHS', 'KOREKSI (-)'];
const EKSP = ['YML', 'MJM', 'TIM SERVICE', 'TIM BC', 'TIM HO', 'TIM WH', 'DIJEMPUT', 'DIANTAR', 'DHL', 'FEDEX', 'J&T EXPRESS', 'J&T CARGO', 'JNE', 'TIKI', 'POS', 'LION PARCEL', 'DUTA CARGO', 'PANDU', 'PSM', 'PSSR', 'TRAVEL'];
const CATS = ['Filter', 'Engine', 'Hidrolik', 'Transmisi', 'Undercarriage', 'Kelistrikan', 'Ground Engaging Tools', 'Seal & Gasket', 'Pelumas', 'Lain-lain'];

function reindex() {
  stockMap = new Map();
  for (const m of S.movements) stockMap.set(m.partId, (stockMap.get(m.partId) || 0) + (m.dir === 'in' ? m.qty : -m.qty));
  partMap = new Map(S.parts.map(p => [p.id, p]));
  custMap = new Map(S.customers.map(p => [p.id, p]));
  suppMap = new Map(S.suppliers.map(p => [p.id, p]));
  poMap = new Map(S.pos.map(p => [p.id, p]));
  delivIdx = new Map(); reqIdx = new Map();
  for (const m of S.movements) {
    const ref = String(m.poRef || poMap.get(m.poId)?.poNo || '').trim().toUpperCase(); if (!ref) continue;
    const k = ref + '|' + m.partId; const T = m.dir === 'out' ? delivIdx : reqIdx; T.set(k, (T.get(k) || 0) + m.qty);
  }
  commit = new Map();
  for (const po of S.pos) { if (po.status === 'batal') continue; const ref = String(po.poNo || '').trim().toUpperCase(); for (const it of po.items || []) { const sisa = Math.max(0, it.qty - (delivIdx.get(ref + '|' + it.partId) || 0)); if (sisa) commit.set(it.partId, (commit.get(it.partId) || 0) + sisa); } }
  closedSet = new Set(S.settings.find(x => x.key === 'closed')?.months || []);
  dataVer++;
  dm = new Map();
  for (const m of S.movements) { if (m.dir !== 'out' || !DELIV_KINDS.includes(m.kind)) continue; const ym = (m.date || '').slice(0, 7); let a = dm.get(m.partId); if (!a) { a = new Map(); dm.set(m.partId, a); } a.set(ym, (a.get(ym) || 0) + m.qty); }
  for (const p of S.parts) if (p.hist) { let a = dm.get(p.id); if (!a) { a = new Map(); dm.set(p.id, a); } for (const [k, q] of Object.entries(p.hist)) a.set(k, (a.get(k) || 0) + q); }
  soReq = new Map(); incoming = new Map();
  for (const l of S.sorders) { if (l.done) continue; const k = String(l.period || '').trim().toUpperCase() + '|' + l.partId; soReq.set(k, (soReq.get(k) || 0) + l.req); }
  for (const [k, req] of soReq) { const sisa = Math.max(0, req - (reqIdx.get(k) || 0)); if (sisa) { const pid = k.slice(k.lastIndexOf('|') + 1); incoming.set(pid, (incoming.get(pid) || 0) + sisa); } }
  minMap = new Map(); for (const a of analyze(today().slice(0, 7)).values()) minMap.set(a.p.id, a.min);
  const optsOf = a => [...new Set(a.filter(Boolean))].map(v => `<option value="${esc(v)}"></option>`).join('');
  $('#custlist').innerHTML = optsOf(S.customers.map(c => c.name).sort(byText));
  $('#srclist').innerHTML = optsOf(['IPE SGP', ...S.suppliers.map(c => c.name).sort(byText)]);
  $('#polist').innerHTML = optsOf([...S.pos.filter(p => p.status !== 'batal').map(p => p.poNo), ...S.sorders.map(l => l.period)]);
  $('#plantlist').innerHTML = optsOf(['BUNDLING', 'SERVICE', ...S.customers.map(c => (c.group || '').trim().toUpperCase()).sort(byText)]);

/* ============ GRAFIK REVENUE (garis halus + area) ============ */
function revChartSVG(vals, tgM, W) {

  const top = Math.max(...vals, tgM || 0, 1), stepRaw = top / 4, mag = Math.pow(10, Math.floor(Math.log10(stepRaw))), step = [1, 2, 2.5, 5, 10].map(f => f * mag).find(x => x >= stepRaw), ymax = step * Math.ceil(top * 1.12 / step);

  const jt = v => { const m = v / 1e6; if (m >= 1000) return (m / 1000).toFixed(2).replace('.', ',') + ' M'; if (m >= 100) return Math.round(m) + ' jt'; if (m >= 1) return m.toFixed(1).replace('.', ',') + ' jt'; return v > 0 ? Math.round(v / 1e3) + ' rb' : '0'; };
  const ax = v => { const m = v / 1e6; return m >= 1000 ? (m / 1000).toString().replace('.', ',') + ' M' : m === 0 ? '0' : (Math.round(m * 10) / 10).toString().replace('.', ',') + (narrow ? '' : ' jt'); };

  mt[0] = d[0]; mt[n - 1] = d[n - 2]; for (let i = 1; i < n - 1; i++) mt[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;

  const area = `${path} L${xs[n - 1].toFixed(1)},${(pad.t + ph).toFixed(1)} L${xs[0].toFixed(1)},${(pad.t + ph).toFixed(1)} Z`;
  let g = '', lab = '';
  for (let v = 0; v <= ymax + 1e-6; v += step) { const y = Y(v); g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e6e8ec" stroke-width="1"/><text x="${pad.l - 7}" y="${(y + 4).toFixed(1)}" text-anchor="end" fill="#7b808a" font-size="${fs - 0.5}">${ax(v)}</text>`; }
  for (let i = 0; i < n; i++) {
    g += `<line x1="${xs[i].toFixed(1)}" x2="${xs[i].toFixed(1)}" y1="${pad.t}" y2="${pad.t + ph}" stroke="#f0f1f4" stroke-width="1"/><text x="${xs[i].toFixed(1)}" y="${H - 8}" text-anchor="middle" fill="#555b66" font-size="${fs}">${BULAN[i]}</text>`;
    const lo = (i > 0 && vals[i] < vals[i - 1]) && (i < n - 1 && vals[i] < vals[i + 1]), below = (lo || (i === n - 1 && vals[i] <= vals[i - 1] && vals[i] < ymax * 0.3)) && ys[i] + 19 < pad.t + ph - 4;
    const ty = below ? ys[i] + 19 : ys[i] - 11; lab += `<text x="${xs[i].toFixed(1)}" y="${Math.max(12, ty).toFixed(1)}" text-anchor="middle" fill="#16181d" font-size="${fs}" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round">${vals[i] > 0 ? jt(vals[i]) : '0'}</text>`;
  }

async function wipeAll() {
  if (!isFull) return denied();
  const ok = await new Promise(res => {
    const m = modal(`<h3 style="color:var(--bad)">⚠ Hapus SEMUA data</h3>

    <button type="button" class="btn" data-x="bk">Unduh backup lengkap (JSON) dulu</button>
    <p style="margin:14px 0 6px">Untuk melanjutkan, ketik <b>HAPUS SEMUA</b> pada kolom di bawah:</p>
    <input id="wcf" autocomplete="off" placeholder="HAPUS SEMUA" style="width:100%">
    <div class="actions"><button type="button" class="btn" data-x="no">Batal</button><button type="button" class="btn danger" data-x="go" disabled>Hapus semua</button></div>`);
    const inp = m.el.querySelector('#wcf'), go = m.el.querySelector('[data-x=go]'); let left = 5, done = false;
    const upd = () => { const match = inp.value.trim() === 'HAPUS SEMUA'; go.disabled = !(match && left <= 0); go.textContent = left > 0 ? `Hapus semua (${left})` : 'Hapus semua'; };
    const tm = setInterval(() => { left--; upd(); if (left <= 0) clearInterval(tm); }, 1000);
    const fin = v => { if (done) return; done = true; clearInterval(tm); m.close(); res(v); };
    inp.addEventListener('input', upd); upd(); inp.focus();
    m.el.addEventListener('click', e => { const b = e.target.closest('[data-x]'); if (!b) return; if (b.dataset.x === 'bk') backupJSON(); if (b.dataset.x === 'no') fin(false); if (b.dataset.x === 'go' && !go.disabled) fin(true); });
    new MutationObserver(() => { if (!document.body.contains(m.el)) fin(false); }).observe(document.body, { childList: true, subtree: true });
  });
  if (!ok) return;
  toast('Menghapus data…');
  await guarded(async () => {
    for (const k of ['movements', 'sorders', 'pos', 'parts', 'customers', 'suppliers']) {
      for (const x of S[k].slice()) await db.doc(`${k}/${x.id}`).delete();
    }
  });
  toast('Semua data dihapus');
}

/* CSV import */
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const lines0 = text.split(/\r?\n/);
  if (/^sep=/i.test(lines0[0])) lines0.shift();
  text = lines0.join('\n');
  const first = text.split('\n')[0] || '';
  const delim = [';', '\t', ','].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}

const custKey = s => normName(String(s || '').toUpperCase().replace(/(^|[\s,.])(PT|CV|TBK|UD|PD)(?=[\s,.]|$)/g, ' '));
const CUST_ALIASES = {
  name: ['nama', 'customer', 'nama customer', 'customer name', 'nama perusahaan', 'perusahaan', 'pelanggan', 'name', 'company', 'cust name', 'customer list'],
  group: ['grup', 'group', 'group customer', 'grup customer', 'holding', 'induk', 'parent', 'kelompok', 'customer group', 'nama grup', 'group name'],
  plants: ['plant', 'plants', 'estate', 'lokasi', 'site', 'unit usaha'],
  pic: ['pic', 'kontak', 'contact', 'contact person', 'nama pic'], phone: ['telepon', 'telp', 'phone', 'hp', 'no hp', 'no telp', 'no. telp', 'whatsapp', 'wa'],
  email: ['email', 'e-mail'], city: ['kota', 'city', 'kabupaten', 'wilayah'], address: ['alamat', 'address'], note: ['catatan', 'note', 'keterangan', 'remark']
};
function parseCustomerSheet(rows) {
  const norm = v => String(v == null ? '' : v).trim().toLowerCase().replace(/\s+/g, ' ');
  let hi = -1, map = null;
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const m = {}; (rows[i] || []).forEach((c, j) => { const t = norm(c); if (!t) return; for (const [k, al] of Object.entries(CUST_ALIASES)) if (!(k in m) && al.includes(t)) m[k] = j; });
    if ('name' in m) { hi = i; map = m; break; }
  }
  if (hi < 0) return null;
  const out = new Map(); let blank = 0;
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i] || [], g = k => (k in map ? cleanTxt(r[map[k]]) : ''), name = g('name'); if (!name) { if (r.some(c => c != null && String(c).trim())) blank++; continue; }
    const key = custKey(name); const cur = out.get(key) || { name, group: '', plants: new Set(), pic: '', phone: '', email: '', city: '', address: '', note: '' };
    for (const k of ['group', 'pic', 'phone', 'email', 'city', 'address', 'note']) if (!cur[k] && g(k)) cur[k] = g(k);
    if (g('plants')) g('plants').split(/[;,]/).map(s => s.trim()).filter(Boolean).forEach(p => cur.plants.add(p));
    out.set(key, cur);
  }
  return { rows: [...out.values()].map(c => ({ ...c, plants: [...c.plants] })), blank, cols: Object.keys(map), headerRow: hi + 1 };
}

  const R = computeSOH(ym), start = ym + '-01', end = ym + '-31';

  for (const [pid, r] of R) { const o = SOH_OUT.reduce((s, x) => s + r[x[0]], 0) + r.other, a = r.awal + r.in - o; awal += r.awal; inn += r.in; out += o; akhir += a; if (a < 0) neg.push({ p: partMap.get(pid), a }); }
  let txIn = 0, txOut = 0, orphan = 0;
  for (const m of S.movements) { const d = m.date || ''; if (d < start || d > end) continue; if (!partMap.has(m.partId)) orphan++; if (m.dir === 'in') { if (!isOpening(m)) txIn += m.qty; } else txOut += m.qty; }

}

/* ============ SOH BULANAN ============ */
const SOH_OUT = [['sold', 'SOLD CUSTOMER', 'Sold Customer'], ['bjm', 'IPE BJM', 'IPE BJM'], ['smd', 'IPE SMD', 'IPE SMD'], ['bpp', 'IPE BPP', 'IPE BPP'], ['ptk', 'IPE PTK', 'IPE PTK'], ['sby', 'IPE SBY', 'IPE SBY'], ['jkt', 'IPE JKT', 'IPE JKT'], ['pky', 'IPE PKY', 'IPE PKY'], ['wh', 'WH03 SERVICE', 'WH03 Service'], ['bund', 'BUNDLING', 'Bundling'], ['dmg', 'PART DAMAGE', 'Part Damage']];
function computeSOH(ym) {
  const start = ym + '-01', end = ym + '-31'; const R = new Map();
  const get = id => { let r = R.get(id); if (!r) { r = { awal: 0, in: 0, other: 0 }; SOH_OUT.forEach(o => r[o[0]] = 0); R.set(id, r); } return r; };
  const byKind = new Map(SOH_OUT.map(o => [o[1], o[0]]));
  for (const m of S.movements) {
    if (!partMap.has(m.partId)) continue; const d = m.date || ''; if (d > end) continue;
    const r = get(m.partId);
    if (d < start) { r.awal += m.dir === 'in' ? m.qty : -m.qty; continue; }
    if (m.dir === 'in') { if (isOpening(m)) r.awal += m.qty; else r.in += m.qty; }
    else { const k = byKind.get(m.kind); if (k) r[k] += m.qty; else r.other += m.qty; }
  }
  return R;
}

/* ============ KARTU STOK ============ */
function ledgerFor(partId) {
  /* Pada tanggal yang sama: saldo awal dulu, lalu barang masuk, baru barang keluar (barang diterima dulu sebelum dikirim); sisanya menurut urutan input. */
  const rank = m => isOpening(m) ? 0 : m.dir === 'in' ? 1 : 2;
  const rows = S.movements.filter(m => m.partId === partId).sort((a, b) => (a.date || '').localeCompare(b.date || '') || (rank(a) - rank(b)) || ((a.seq ?? 1e9) - (b.seq ?? 1e9)) || (a.at || '').localeCompare(b.at || ''));
  let bal = 0; return rows.map(m => { const i = m.dir === 'in' ? m.qty : 0, o = m.dir === 'out' ? m.qty : 0; bal += i - o; return { ...m, i, o, bal }; });
}
/* ===== Pemeriksa stok minus: cari part yang saldo kartu stoknya pernah minus & duga tanggal yang keliru ===== */

const PAPER = { A3: [297, 420], A4: [210, 297], A5: [148, 210], A6: [105, 148], B5: [176, 250], Letter: [216, 279], 'Kustom': null };
function shipLabelPDF(v) {
  const J = window.jspdf && window.jspdf.jsPDF; if (!J) { toast('Pustaka PDF belum termuat, coba lagi sebentar', 'err'); return null; }
  let [pw, ph] = PAPER[v.kertas] || [+v.cw || 0, +v.ch || 0];
  if (!(pw >= 50 && ph >= 40)) { toast('Ukuran kustom minimal 50 x 40 mm.', 'err'); return null; }
  const short = Math.min(pw, ph), long = Math.max(pw, ph), land = v.arah !== 'portrait';
  const W = land ? long : short, H = land ? short : long, n = Math.max(1, Math.min(200, parseInt(v.jumlah) || 1));
  const doc = new J({ unit: 'mm', format: [short, long], orientation: land ? 'landscape' : 'portrait' });
  const k = Math.min(W / 210, H / 148), LW = W / k, LH = H / k;   // koordinat logis dikali k
  for (let pg = 0; pg < n; pg++) {
    if (pg) doc.addPage([short, long], land ? 'landscape' : 'portrait');
    doc.setDrawColor(0).setLineWidth(0.8 * k).rect(8 * k, 8 * k, W - 16 * k, H - 16 * k);
    try { doc.addImage(LOGO_JPG, 'JPEG', 14 * k, 11 * k, 68 * k, 68 * 121 / 430 * k); } catch (e) {}
    doc.setDrawColor(0).setLineWidth(0.5 * k).line(8 * k, 35 * k, W - 8 * k, 35 * k);
    let y = 47; const X1 = 20, X2 = 62, X3 = 66, MW = LW - X3 - 16, LH1 = 6.4;
    doc.setFontSize(13 * k);
    const block = (label, lines) => {
      doc.setFont('times', 'bold').setFontSize(13 * k).text(label, X1 * k, y * k); doc.text(':', X2 * k, y * k);
      const out = []; for (const ln of lines) { const t = String(ln).trim(); if (t) out.push(...doc.splitTextToSize(t, MW * k).map(x => x)); }
      out.forEach((t, i) => doc.text(t, X3 * k, (y + i * LH1) * k)); y += Math.max(1, out.length) * LH1 + 7;
    };
    block('Dikirim Kepada', [v.nama]);
    block('Alamat', String(v.alamat || '').split('\n'));
    if ((v.penerima || '').trim() || (v.telp || '').trim()) block('Penerima', [`${(v.penerima || '').trim()}${(v.telp || '').trim() ? ` (${v.telp.trim()})` : ''}`.trim()]);
    block('Dari', String(v.dari || '').split('\n'));
  }
  return doc;
}
function shipLabel(id) {

      ${fld('Orientasi', 'arah', { opts: [['landscape', 'Mendatar (landscape)'], ['portrait', 'Tegak (portrait)']], val: ps.arah })}
      <div id="cust" class="grid" ${ps.kertas === 'Kustom' ? '' : 'hidden'} style="grid-column:1/-1;margin:0;padding:0">${fld('Lebar (mm)', 'cw', { type: 'number', val: ps.cw, attrs: 'min="50" step="any"' })}${fld('Tinggi (mm)', 'ch', { type: 'number', val: ps.ch, attrs: 'min="40" step="any"' })}</div>

  m.el.addEventListener('change', e => { if (e.target.name === 'kertas') $('#cust', m.el).hidden = e.target.value !== 'Kustom'; });
  m.el.addEventListener('click', e => {
    const b = e.target.closest('[data-x]'); if (!b) return; if (b.dataset.x === 'c') return m.close();

    const doc = shipLabelPDF(v); if (!doc) return;
    if (b.dataset.x === 'd') { saveFile(`alamat-${c.name.replace(/[\\/:*?"<>|]/g, '-').slice(0, 40)}.pdf`, doc.output('blob')); m.close(); return; }
    const url = URL.createObjectURL(doc.output('blob')); let done = false;
    const fallback = () => { if (done) return; done = true; window.open(url, '_blank') || toast('Pop-up diblokir. Izinkan pop-up atau pakai Unduh PDF.', 'err'); };
    try {
      const fr = document.createElement('iframe'); fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0'; fr.src = url;
      fr.onload = () => { try { fr.contentWindow.focus(); fr.contentWindow.print(); done = true; } catch (e2) { fallback(); } setTimeout(() => { fr.remove(); URL.revokeObjectURL(url); }, 60000); };
      document.body.appendChild(fr);
    } catch (e3) { fallback(); }

function parsePasted(text) {

  /* kolom part number: utamakan "Item No." (SAP), lalu Material/Part No; "Kode Parts Lama", "BP Catalog No." dan sejenisnya TIDAK dipakai */
  let pc = colx(/^item ?(no|code|number)\b|^no\.? ?item|^itemcode/i, OLD); if (pc < 0) pc = colx(/material|part ?n|part ?no|no\.? ?part/i, OLD); if (pc < 0) pc = colx(/kode|code/i, OLD);

    if (pc >= 0 && !(cells[pc] || '').trim() && !(qc >= 0 && numID(cells[qc] || '') > 0)) continue; /* baris kosong/total dari SAP */

    let desc = dc >= 0 ? cells[dc] : cells.filter((c, i) => i !== pi && c && !isNum(c) && !/^(PC|PCS|EA|UNIT|ST|SET)$/i.test(c)).sort((a, b) => b.length - a.length)[0] || '';

  }

  return { rows: [...mp.values()], bad, header: !!hdr };
}

function upsertLocal(k, r) {
  const o = { id: r.id, ...(r.data || {}) }; const i = S[k].findIndex(x => x.id === r.id);
  if (i >= 0) S[k][i] = o; else S[k].push(o);
}
const TBL = k => (k === 'sorders' ? 'stockorders' : k);
function makeDb() {
  const chk = (error, rows, what) => { if (error) throw error; if (rows && !rows.length) throw new Error('Tidak punya izin untuk ' + what); };
  return {
    collection: k => ({
      async add(data) { const { data: r, error } = await sb.from(TBL(k)).insert({ data }).select('id,data').single(); if (error) throw error; upsertLocal(k, r); schedule(); return { id: r.id }; },
      async addMany(list) {
        const out = [];
        for (let i = 0; i < list.length; i += 500) {
          const { data: rs, error } = await sb.from(TBL(k)).insert(list.slice(i, i + 500).map(data => ({ data }))).select('id,data'); if (error) throw error;
          rs.forEach(r => upsertLocal(k, r)); out.push(...rs);
        }
        schedule(); return out;
      }
    }),
    doc: path => {
      const [k, id] = path.split('/');
      return {
        async update(patch) {
          const cur = S[k].find(x => x.id === id) || {}; const { id: _i, ...rest } = cur; const nd = { ...rest, ...patch };
          const { data, error } = await sb.from(TBL(k)).update({ data: nd, updated_at: nowISO() }).eq('id', id).select('id'); chk(error, data, 'mengubah data');
          upsertLocal(k, { id, data: nd }); schedule();
        },
        async delete() {
          const { data, error } = await sb.from(TBL(k)).delete().eq('id', id).select('id'); chk(error, data, 'menghapus data');
          S[k] = S[k].filter(x => x.id !== id); schedule();
        }
      };
    }
  };
}
async function fetchAll(k) {
  const out = []; const step = 1000;
  for (let from = 0; ; from += step) {
    const { data, error } = await sb.from(TBL(k)).select('id,data').order('created_at', { ascending: true }).order('id').range(from, from + step - 1);
    if (error) throw error; out.push(...data); if (data.length < step) break;
  }
  return out;
}

  const cfg = window.WMS_CONFIG;
  if (!cfg || !cfg.SUPABASE_URL || /ISI_|YOUR_/i.test(cfg.SUPABASE_URL + cfg.SUPABASE_ANON_KEY) || !window.supabase) {
    $('#main').innerHTML = '<div class="card"><h2>Konfigurasi belum diisi</h2><p class="mut">Buka file <b>config.js</b> lalu isi <b>SUPABASE_URL</b> dan <b>SUPABASE_ANON_KEY</b> sesuai panduan.</p></div>'; $('#role').textContent = 'Belum dikonfigurasi'; return;
  }
  let base = '';
  try { const u = new URL(String(cfg.SUPABASE_URL).trim()); base = u.origin; } catch (e) { }
  if (!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(base)) {
    $('#main').innerHTML = '<div class="card"><h2>SUPABASE_URL di config.js tidak benar</h2><p class="mut">Isi dengan <b>Project URL</b> berbentuk <code>https://xxxxxxxx.supabase.co</code> (dari Project Settings &gt; API), bukan alamat dashboard dan tanpa tambahan di belakangnya.</p></div>'; $('#role').textContent = 'Konfigurasi salah'; return;
  }
  sb = window.supabase.createClient(base, String(cfg.SUPABASE_ANON_KEY).trim());
  const { data: { session } } = await sb.auth.getSession();
  if (session) start(session); else { $('#role').textContent = 'Belum masuk'; showLogin(); }
}
boot();
/* ===== PWA: bisa dipasang di smartphone ===== */
(() => {
  const btn = document.getElementById('pwa'); if (!btn) return;
  const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  let dp = null;
  if (standalone()) return;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); dp = e; btn.hidden = false; });
  window.addEventListener('appinstalled', () => { btn.hidden = true; dp = null; toast('Aplikasi terpasang. Buka dari layar utama.'); });
  if (ios) btn.hidden = false;
  btn.addEventListener('click', async () => {
    if (dp) { dp.prompt(); try { await dp.userChoice; } catch (e) { } dp = null; btn.hidden = true; return; }
    modal(`<h3>Pasang di layar utama</h3><p>${ios ? 'Di iPhone/iPad (Safari): ketuk tombol <b>Bagikan</b> (kotak dengan panah ke atas), lalu pilih <b>Tambah ke Layar Utama</b>.' : 'Di Chrome: ketuk menu <b>⋮</b> di kanan atas, lalu pilih <b>Instal aplikasi</b> atau <b>Tambahkan ke layar utama</b>.'}</p><div class="actions"><button class="btn primary" data-x="c" onclick="this.closest('.ov').remove()">Mengerti</button></div>`);
  });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
})();
</script>
